<!DOCTYPE html>

<title>Flash Mate · U03.B.6c · Raíces</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U03.B.6c', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U03', unidadNum: '03', subunidad: 'B', nivel: 'c',
  titulo: 'Raíces',
  sub: 'Operatoria combinada · racionalización · tipo PAES',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Resolver problemas', 'Resolver problemas', 'Representar', 'Argumentar', 'Resolver problemas', 'Representar'],
  generar: function () {
    var E = [];

    // P1 · evaluacion mixta de raices (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\sqrt{16}-\\sqrt[3]{125}+\\sqrt[4]{81}-\\sqrt[5]{-32}\\).',
      [{ t: '\\(4\\)', err: null },
       { t: '\\(2\\)', err: 'Cuidado con el último signo: \\(\\sqrt[5]{-32}=-2\\), y restar \\(-2\\) suma: \\(4-5+3+2=4\\).' },
       { t: '\\(14\\)', err: 'Son raíces, no los propios números: \\(4-5+3-(-2)=4\\).' },
       { t: '\\(6\\)', err: 'Revisa \\(\\sqrt[3]{125}=5\\): \\(4-5+3+2=4\\).' }],
      'Correcto. \\(\\sqrt{16}=4\\), \\(\\sqrt[3]{125}=5\\), \\(\\sqrt[4]{81}=3\\), \\(\\sqrt[5]{-32}=-2\\): \\(4-5+3-(-2)=4\\).'));

    // P2 · fraccion con raices (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\dfrac{\\sqrt[3]{(-2)^3}-\\sqrt{5^2}}{\\sqrt[4]{5^4}}\\).',
      [{ t: '\\(-\\tfrac{7}{5}\\)', err: null },
       { t: '\\(-2\\)', err: 'El denominador es \\(\\sqrt[4]{5^4}=5\\), no 1: \\(\\dfrac{-2-5}{5}=-\\tfrac{7}{5}\\).' },
       { t: '\\(-\\tfrac{3}{5}\\)', err: '\\(\\sqrt[3]{(-2)^3}=-2\\) y \\(\\sqrt{5^2}=5\\); el numerador es \\(-2-5=-7\\): \\(-\\tfrac{7}{5}\\).' },
       { t: '\\(\\tfrac{7}{5}\\)', err: 'El numerador es negativo: \\(-2-5=-7\\), da \\(-\\tfrac{7}{5}\\).' }],
      'Correcto. \\(\\sqrt[3]{(-2)^3}=-2\\), \\(\\sqrt{5^2}=5\\), \\(\\sqrt[4]{5^4}=5\\): \\(\\dfrac{-2-5}{5}=-\\tfrac{7}{5}\\).'));

    // P3 · raices de decimales (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\sqrt{0{,}04}+\\sqrt[3]{0{,}064}\\).',
      [{ t: '\\(0{,}6\\)', err: null },
       { t: '\\(0{,}24\\)', err: 'No se multiplican: \\(\\sqrt{0{,}04}=0{,}2\\) y \\(\\sqrt[3]{0{,}064}=0{,}4\\); se suman: \\(0{,}6\\).' },
       { t: '\\(0{,}024\\)', err: 'Cada raíz da un decimal simple: \\(0{,}2+0{,}4=0{,}6\\).' },
       { t: '\\(1\\)', err: 'Revisa: \\(0{,}2^2=0{,}04\\) y \\(0{,}4^3=0{,}064\\); suma \\(0{,}6\\).' }],
      'Correcto. \\(\\sqrt{0{,}04}=0{,}2\\) (\\(0{,}2^2=0{,}04\\)) y \\(\\sqrt[3]{0{,}064}=0{,}4\\) (\\(0{,}4^3=0{,}064\\)): \\(0{,}2+0{,}4=0{,}6\\).'));

    // P4 · fraccion de sumas de raices (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\dfrac{\\sqrt[4]{16}+\\sqrt{25}}{\\sqrt{9}+\\sqrt[3]{27}}\\).',
      [{ t: '\\(\\tfrac{7}{6}\\)', err: null },
       { t: '\\(\\tfrac{7}{2}\\)', err: 'El denominador es \\(\\sqrt9+\\sqrt[3]{27}=3+3=6\\): \\(\\dfrac{2+5}{6}=\\tfrac{7}{6}\\).' },
       { t: '\\(\\tfrac{3}{2}\\)', err: 'El numerador es \\(\\sqrt[4]{16}+\\sqrt{25}=2+5=7\\): \\(\\dfrac{7}{6}\\).' },
       { t: '\\(\\tfrac{7}{4}\\)', err: 'Revisa \\(\\sqrt[3]{27}=3\\): denominador \\(3+3=6\\), da \\(\\tfrac{7}{6}\\).' }],
      'Correcto. Numerador \\(2+5=7\\); denominador \\(3+3=6\\): \\(\\dfrac{7}{6}\\).'));

    // P5 · racionalizacion simple (Representar)
    E.push(armar('Representar', 'Racionaliza \\(\\dfrac{2}{\\sqrt{3}}\\).',
      [{ t: '\\(\\dfrac{2\\sqrt{3}}{3}\\)', err: null },
       { t: '\\(\\dfrac{2}{3}\\)', err: 'Al amplificar por \\(\\sqrt3\\), el numerador queda \\(2\\sqrt3\\) (no desaparece la raíz): \\(\\dfrac{2\\sqrt3}{3}\\).' },
       { t: '\\(\\dfrac{\\sqrt{3}}{3}\\)', err: 'El 2 del numerador se mantiene: \\(\\dfrac{2\\sqrt3}{3}\\).' },
       { t: '\\(\\dfrac{2\\sqrt{3}}{9}\\)', err: 'El denominador es \\(\\sqrt3\\cdot\\sqrt3=3\\), no 9: \\(\\dfrac{2\\sqrt3}{3}\\).' }],
      'Correcto. Amplifico por \\(\\dfrac{\\sqrt3}{\\sqrt3}\\): \\(\\dfrac{2}{\\sqrt3}\\cdot\\dfrac{\\sqrt3}{\\sqrt3}=\\dfrac{2\\sqrt3}{3}\\).'));

    // P6 · por que racionalizar (Argumentar)
    E.push(armar('Argumentar', 'Al racionalizar \\(\\dfrac{2}{\\sqrt3}\\) se multiplica por \\(\\dfrac{\\sqrt3}{\\sqrt3}\\). ¿Por qué esto NO cambia el valor?',
      [{ t: 'Porque \\(\\dfrac{\\sqrt3}{\\sqrt3}=1\\), y multiplicar por 1 no altera el valor.', err: null },
       { t: 'Porque las raíces siempre se pueden eliminar.', err: 'No es que se puedan eliminar sin más: se multiplica por algo igual a 1 para no cambiar el valor.' },
       { t: 'Porque \\(\\sqrt3\\cdot\\sqrt3=6\\).', err: '\\(\\sqrt3\\cdot\\sqrt3=3\\), no 6. La clave es que \\(\\dfrac{\\sqrt3}{\\sqrt3}=1\\).' },
       { t: 'Porque el numerador y el denominador se anulan.', err: 'No se anulan: la fracción \\(\\dfrac{\\sqrt3}{\\sqrt3}\\) vale 1, por eso conserva el valor.' }],
      'Correcto. \\(\\dfrac{\\sqrt3}{\\sqrt3}=1\\): multiplicar por 1 mantiene el valor, y de paso elimina la raíz del denominador.'));

    // P7 · multiplicacion con indices distintos (Resolver)
    E.push(armar('Resolver problemas', 'Reduce \\(\\dfrac{\\sqrt{2}\\cdot\\sqrt{6}}{\\sqrt[4]{3}}\\).',
      [{ t: '\\(2\\sqrt[4]{3}\\)', err: null },
       { t: '\\(\\dfrac{\\sqrt[8]{36}}{3}\\)', err: 'Primero \\(\\sqrt2\\cdot\\sqrt6=\\sqrt{12}=2\\sqrt3\\); luego \\(\\dfrac{2\\sqrt3}{\\sqrt[4]3}=2\\cdot3^{1/2-1/4}=2\\sqrt[4]{3}\\).' },
       { t: '\\(\\dfrac{\\sqrt[6]{36}}{3}\\)', err: 'Conviene pasar a potencias: \\(\\dfrac{2\\cdot3^{1/2}}{3^{1/4}}=2\\cdot3^{1/4}=2\\sqrt[4]{3}\\).' },
       { t: '\\(2\\sqrt{3}\\cdot\\sqrt[4]{27}\\)', err: 'Se restan los exponentes de la base 3: \\(3^{1/2-1/4}=3^{1/4}=\\sqrt[4]{3}\\), da \\(2\\sqrt[4]{3}\\).' }],
      'Correcto. \\(\\sqrt2\\cdot\\sqrt6=\\sqrt{12}=2\\sqrt3\\); luego \\(\\dfrac{2\\cdot3^{1/2}}{3^{1/4}}=2\\cdot3^{1/4}=2\\sqrt[4]{3}\\).'));

    // P8 · racionalizacion de binomio (Representar)
    E.push(armar('Representar', 'Racionaliza \\(\\dfrac{\\sqrt{ab}}{\\sqrt{a}+\\sqrt{b}}\\).',
      [{ t: '\\(\\dfrac{a\\sqrt{b}-b\\sqrt{a}}{a-b}\\)', err: null },
       { t: '\\(\\dfrac{a\\sqrt{b}+b\\sqrt{a}}{a-b}\\)', err: 'Se amplifica por el CONJUGADO \\(\\sqrt a-\\sqrt b\\); el numerador da \\(a\\sqrt b-b\\sqrt a\\).' },
       { t: '\\(\\dfrac{a\\sqrt{b}+b\\sqrt{a}}{a+b}\\)', err: 'El denominador es \\((\\sqrt a+\\sqrt b)(\\sqrt a-\\sqrt b)=a-b\\), no \\(a+b\\).' },
       { t: '\\(\\dfrac{a+b\\sqrt{a}}{a-b}\\)', err: 'Distribuye \\(\\sqrt{ab}(\\sqrt a-\\sqrt b)=a\\sqrt b-b\\sqrt a\\) en el numerador.' }],
      'Correcto. Amplifico por el conjugado \\(\\sqrt a-\\sqrt b\\): denominador \\(a-b\\) y numerador \\(\\sqrt{ab}(\\sqrt a-\\sqrt b)=a\\sqrt b-b\\sqrt a\\).'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
