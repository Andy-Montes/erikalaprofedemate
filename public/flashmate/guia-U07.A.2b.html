<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U07.A.2b · Método de reducción</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U07.A.2b', eje: 'E2', ejeNombre: 'ÁLGEBRA Y FUNCIONES', unidad: 'U07', unidadNum: '07', subunidad: 'A', nivel: 'b',
  titulo: 'Método de reducción',
  sub: 'Igualar coeficientes · sumar o restar · despejar',
  HAB_E: ['Argumentar', 'Resolver problemas', 'Resolver problemas', 'Argumentar', 'Representar', 'Resolver problemas', 'Resolver problemas', 'Modelar'],
  generar: function () {
    var E = [];

    // P1 · concepto (Argumentar)
    E.push(armar('Argumentar', '¿En qué consiste el método de reducción para resolver un sistema?',
      [{ t: 'En igualar los coeficientes de una incógnita y luego sumar o restar las ecuaciones para eliminarla.', err: null },
       { t: 'En despejar una incógnita y reemplazarla en la otra ecuación.', err: 'Eso es SUSTITUCIÓN. La reducción iguala coeficientes y suma/resta para eliminar una incógnita.' },
       { t: 'En despejar la misma incógnita en ambas e igualar las expresiones.', err: 'Eso es IGUALACIÓN. La reducción elimina una incógnita sumando o restando las ecuaciones.' },
       { t: 'En dibujar las rectas y ver dónde se cortan.', err: 'Ese es el método gráfico. La reducción es algebraica: iguala coeficientes y suma/resta.' }],
      'Correcto. Reducción: igualar coeficientes de una incógnita y sumar/restar para eliminarla.'));

    // P2 · sumar directo → x (Resolver) — PDF
    E.push(armar('Resolver problemas', 'En \\(5x+3y=17\\) y \\(2x-3y=-10\\), los coeficientes de \\(y\\) son \\(+3\\) y \\(-3\\). Al SUMAR ambas ecuaciones, ¿qué valor de \\(x\\) se obtiene?',
      [{ t: '\\(x=1\\)', err: null },
       { t: '\\(x=7\\)', err: 'Sumando queda \\(7x=7\\Rightarrow x=1\\). El 7 es antes de dividir.' },
       { t: '\\(x=-1\\)', err: '\\(7x=7\\) y \\(7:7=1\\) (positivo): \\(x=1\\).' },
       { t: '\\(x=\\tfrac{7}{5}\\)', err: 'Los coef de \\(x\\) se suman: \\(5+2=7\\), no 5: \\(7x=7\\Rightarrow x=1\\).' }],
      'Correcto. \\(5x+2x=7x\\) y \\(3y-3y=0\\); \\(17+(-10)=7\\): \\(7x=7\\Rightarrow x=1\\).'));

    // P3 · reemplazar → y (Resolver) — PDF
    E.push(armar('Resolver problemas', 'Con \\(x=1\\) en la ecuación \\(5x+3y=17\\) del sistema anterior, ¿cuánto vale \\(y\\)?',
      [{ t: '\\(y=4\\)', err: null },
       { t: '\\(y=12\\)', err: '\\(3y=12\\) es un paso intermedio: falta dividir por 3, \\(y=4\\).' },
       { t: '\\(y=\\tfrac{17}{3}\\)', err: 'Primero resta el \\(5\\): \\(3y=17-5=12\\Rightarrow y=4\\).' },
       { t: '\\(y=6\\)', err: 'Revisa: \\(5\\cdot1+3y=17\\Rightarrow3y=12\\Rightarrow y=4\\).' }],
      'Correcto. \\(5+3y=17\\Rightarrow3y=12\\Rightarrow y=4\\). Solución \\((1,4)\\).'));

    // P4 · multiplicadores para igualar (Argumentar) — PDF
    E.push(armar('Argumentar', 'En \\(4x-3y=3\\) y \\(5x+y=37\\) se quiere eliminar la \\(x\\). ¿Por qué números conviene multiplicar cada ecuación?',
      [{ t: 'La primera por \\(-5\\) y la segunda por \\(4\\).', err: null },
       { t: 'La primera por \\(5\\) y la segunda por \\(4\\).', err: 'Así los coef de \\(x\\) quedan \\(20\\) y \\(20\\): al SUMAR no se eliminan. Se necesitan signos opuestos: \\(-5\\) y \\(4\\).' },
       { t: 'Ambas por \\(2\\).', err: 'Multiplicar por lo mismo no iguala \\(4\\) con \\(5\\): quedan \\(8\\) y \\(10\\), distintos.' },
       { t: 'La primera por \\(3\\) y la segunda por \\(1\\).', err: 'Eso deja los coef de \\(x\\) en \\(12\\) y \\(5\\), distintos. Usa \\(-5\\) y \\(4\\) para \\(-20\\) y \\(20\\).' }],
      'Correcto. \\((-5)\\) y \\(4\\) dan \\(-20x\\) y \\(20x\\): al sumar se elimina \\(x\\).'));

    // P5 · elegir operación (Representar)
    E.push(armar('Representar', 'En \\(x+2y=9\\) y \\(x-y=3\\), los coeficientes de \\(x\\) son iguales (\\(+1\\) y \\(+1\\)). ¿Qué operación elimina la \\(x\\) directamente?',
      [{ t: 'Restar una ecuación de la otra.', err: null },
       { t: 'Sumar las dos ecuaciones.', err: 'Sumar da \\(2x\\), no la elimina. Con coeficientes iguales del mismo signo se RESTA.' },
       { t: 'Multiplicar las ecuaciones entre sí.', err: 'Las ecuaciones no se multiplican entre sí; se suman o restan.' },
       { t: 'Elevar ambas al cuadrado.', err: 'No corresponde: con coeficientes iguales del mismo signo, se restan las ecuaciones.' }],
      'Correcto. Coeficientes iguales y del mismo signo: se RESTAN las ecuaciones para eliminar \\(x\\).'));

    // P6 · resolver (Resolver)
    E.push(armar('Resolver problemas', 'Resuelve por reducción \\(x+y=7\\) y \\(x-y=3\\).',
      [{ t: '\\((5,2)\\)', err: null },
       { t: '\\((2,5)\\)', err: 'Sumando: \\(2x=10\\Rightarrow x=5\\); luego \\(y=2\\). El par es \\((5,2)\\), con \\(x\\) primero.' },
       { t: '\\((4,3)\\)', err: 'Suma: \\(2x=10\\Rightarrow x=5\\), no 4; y \\(y=7-5=2\\).' },
       { t: '\\((10,4)\\)', err: 'Falta dividir: \\(2x=10\\Rightarrow x=5\\); \\(y=2\\).' }],
      'Correcto. Sumando: \\(2x=10\\Rightarrow x=5\\); \\(y=7-5=2\\). Solución \\((5,2)\\).'));

    // P7 · resolver con eliminación de y (Resolver)
    E.push(armar('Resolver problemas', 'Resuelve por reducción \\(3x+2y=16\\) y \\(x-2y=0\\).',
      [{ t: '\\((4,2)\\)', err: null },
       { t: '\\((2,4)\\)', err: 'Sumando (los \\(2y\\) se cancelan): \\(4x=16\\Rightarrow x=4\\); luego \\(y=2\\). Par \\((4,2)\\).' },
       { t: '\\((4,4)\\)', err: 'De \\(x-2y=0\\) con \\(x=4\\): \\(2y=4\\Rightarrow y=2\\), no 4.' },
       { t: '\\((16,8)\\)', err: 'Falta dividir: \\(4x=16\\Rightarrow x=4\\); \\(y=2\\).' }],
      'Correcto. Sumando: \\(4x=16\\Rightarrow x=4\\); de \\(x-2y=0\\), \\(y=2\\). Solución \\((4,2)\\).'));

    // P8 · modelar y resolver (Modelar)
    E.push(armar('Modelar', 'El triple de un número más otro da \\(10\\); el doble del primero menos el segundo da \\(5\\). ¿Cuáles son los números?',
      [{ t: '\\((3,1)\\)', err: null },
       { t: '\\((1,3)\\)', err: 'El sistema es \\(3x+y=10\\), \\(2x-y=5\\); sumando \\(5x=15\\Rightarrow x=3\\), \\(y=1\\). Par \\((3,1)\\).' },
       { t: '\\((3,3)\\)', err: 'Con \\(x=3\\): \\(3\\cdot3+y=10\\Rightarrow y=1\\), no 3.' },
       { t: '\\((2,4)\\)', err: 'Suma: \\(5x=15\\Rightarrow x=3\\), no 2.' }],
      'Correcto. \\(3x+y=10\\) y \\(2x-y=5\\); sumando \\(5x=15\\Rightarrow x=3\\), \\(y=1\\).'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
</html>
