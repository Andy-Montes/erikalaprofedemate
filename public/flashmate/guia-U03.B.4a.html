<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U03.B.4a · Raíces</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U03.B.4a', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U03', unidadNum: '03', subunidad: 'B', nivel: 'a',
  titulo: 'Raíces',
  sub: 'Definición · índice · existencia en los reales',
  HAB_E: ['Representar', 'Resolver problemas', 'Argumentar', 'Argumentar', 'Resolver problemas', 'Resolver problemas', 'Representar', 'Argumentar'],
  generar: function () {
    var E = [];

    // P1 · definicion (Representar)
    E.push(armar('Representar', '¿Por qué se cumple que \\(\\sqrt[3]{8}=2\\)?',
      [{ t: 'Porque \\(2^3=8\\).', err: null },
       { t: 'Porque \\(2\\cdot3=6\\).', err: 'La raíz no multiplica índice por resultado. Pregunta: ¿qué número elevado a 3 da 8? El 2, porque \\(2^3=8\\).' },
       { t: 'Porque \\(3^2=9\\).', err: 'El índice es 3 y la cantidad subradical es 8: buscamos \\(a\\) con \\(a^3=8\\), o sea \\(a=2\\).' },
       { t: 'Porque \\(8:2=4\\).', err: 'Sacar raíz no es dividir: es hallar la base que elevada al índice da el subradical, \\(2^3=8\\).' }],
      'Correcto. \\(\\sqrt[3]{8}=2\\) porque \\(2^3=8\\): la raíz es el número que elevado al índice da la cantidad subradical.'));

    // P2 · raiz exacta (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\sqrt[5]{32}\\).',
      [{ t: '\\(2\\)', err: null },
       { t: '\\(6\\)', err: 'Buscamos \\(a\\) con \\(a^5=32\\). Como \\(2^5=32\\), la raíz es 2 (no \\(32:5\\)).' },
       { t: '\\(16\\)', err: 'No es dividir por 2: \\(2^5=32\\), así que \\(\\sqrt[5]{32}=2\\).' },
       { t: '\\(5\\)', err: 'El índice es 5, pero la raíz es el número que elevado a 5 da 32: es 2.' }],
      'Correcto. \\(\\sqrt[5]{32}=2\\) porque \\(2^5=32\\).'));

    // P3 · existencia indice par subradical negativo (Argumentar)
    E.push(armar('Argumentar', '¿Existe \\(\\sqrt{-25}\\) en los números reales?',
      [{ t: 'No existe.', err: null },
       { t: 'Sí, es \\(-5\\).', err: '\\((-5)^2=25\\) (positivo), no \\(-25\\). Ningún real al cuadrado da negativo: no existe.' },
       { t: 'Sí, es \\(5\\).', err: '\\(5^2=25\\), no \\(-25\\). Con índice par y subradical negativo no hay raíz real.' },
       { t: 'Sí, es \\(\\pm5\\).', err: 'Ni \\(5\\) ni \\(-5\\) al cuadrado dan \\(-25\\): no existe en los reales.' }],
      'Correcto. Con índice PAR, el subradical debe ser \\(\\geq 0\\). Como \\(-25<0\\), \\(\\sqrt{-25}\\) no existe en los reales.'));

    // P4 · indice impar subradical negativo (Argumentar)
    E.push(armar('Argumentar', '¿Existe \\(\\sqrt[3]{-8}\\) en los números reales?',
      [{ t: 'Sí: es \\(-2\\).', err: null },
       { t: 'No existe.', err: 'Con índice IMPAR sí se puede: \\((-2)^3=-8\\), así que \\(\\sqrt[3]{-8}=-2\\).' },
       { t: 'Sí: es \\(2\\).', err: '\\(2^3=8\\) (positivo). Para \\(-8\\) la base debe ser negativa: \\(-2\\).' },
       { t: 'Sí, pero es un número imaginario.', err: 'No es imaginario: con índice impar la raíz de un negativo es un real negativo, \\(-2\\).' }],
      'Correcto. Con índice IMPAR el subradical puede ser negativo: \\((-2)^3=-8\\), así que \\(\\sqrt[3]{-8}=-2\\).'));

    // P5 · indice implicito (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\sqrt{49}\\) (sin índice escrito).',
      [{ t: '\\(7\\)', err: null },
       { t: '\\(24{,}5\\)', err: 'La raíz no es dividir por 2: buscamos \\(a\\) con \\(a^2=49\\), que es 7.' },
       { t: '\\(±7\\)', err: 'Como raíz aritmética se toma el valor positivo: \\(\\sqrt{49}=7\\).' },
       { t: '\\(9{,}8\\)', err: '\\(7^2=49\\); la raíz cuadrada de 49 es 7.' }],
      'Correcto. Sin índice escrito se asume índice 2 (raíz cuadrada): \\(\\sqrt{49}=7\\) porque \\(7^2=49\\).'));

    // P6 · raiz cubica negativa exacta (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\sqrt[3]{-125}\\).',
      [{ t: '\\(-5\\)', err: null },
       { t: '\\(5\\)', err: 'Para obtener \\(-125\\) la base debe ser negativa: \\((-5)^3=-125\\), así que la raíz es \\(-5\\).' },
       { t: 'No existe.', err: 'El índice es impar (3): sí existe. \\((-5)^3=-125\\), la raíz es \\(-5\\).' },
       { t: '\\(-25\\)', err: '\\((-25)^3\\) es enorme; el número buscado cumple \\(a^3=-125\\): es \\(-5\\).' }],
      'Correcto. \\(\\sqrt[3]{-125}=-5\\) porque \\((-5)^3=-125\\) (índice impar permite subradical negativo).'));

    // P7 · raiz como potencia (Representar)
    E.push(armar('Representar', 'Escribe \\(\\sqrt[5]{8}\\) como una potencia de exponente fraccionario:',
      [{ t: '\\(8^{\\frac{1}{5}}\\)', err: null },
       { t: '\\(8^{5}\\)', err: 'El índice pasa al DENOMINADOR del exponente: \\(\\sqrt[5]{8}=8^{\\frac{1}{5}}\\).' },
       { t: '\\(5^{\\frac{1}{8}}\\)', err: 'La base sigue siendo 8 y el índice 5 va como denominador: \\(8^{\\frac{1}{5}}\\).' },
       { t: '\\(8\\cdot\\tfrac{1}{5}\\)', err: 'No es multiplicar: el índice se vuelve el denominador del exponente, \\(8^{\\frac{1}{5}}\\).' }],
      'Correcto. \\(\\sqrt[x]{a}=a^{\\frac{1}{x}}\\): \\(\\sqrt[5]{8}=8^{\\frac{1}{5}}\\).'));

    // P8 · cual NO existe (Argumentar)
    E.push(armar('Argumentar', '¿Cuál de estas raíces NO se puede calcular en los números reales?',
      [{ t: '\\(\\sqrt[4]{-16}\\)', err: null },
       { t: '\\(\\sqrt[3]{-8}\\)', err: 'Esta SÍ existe: índice impar, \\((-2)^3=-8\\).' },
       { t: '\\(\\sqrt{16}\\)', err: 'Esta existe: \\(4^2=16\\).' },
       { t: '\\(\\sqrt[3]{8}\\)', err: 'Esta existe: \\(2^3=8\\).' }],
      'Correcto. \\(\\sqrt[4]{-16}\\) no existe en los reales: índice PAR con subradical negativo. Las demás sí se pueden calcular.'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
