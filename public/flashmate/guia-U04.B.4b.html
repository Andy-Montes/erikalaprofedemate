<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U04.B.4b', eje: 'E2', ejeNombre: 'ÁLGEBRA Y FUNCIONES', unidad: 'U04', unidadNum: '04', subunidad: 'B', nivel: 'b',
  titulo: 'Productos Notables',
  sub: 'Cuadrado con coeficientes y fracciones · cubo · suma por diferencia',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Resolver problemas', 'Resolver problemas', 'Representar', 'Resolver problemas', 'Argumentar', 'Representar'],
  generar: function () {
    var E = [];

    // P1 · cuadrado con coeficiente (Resolver)
    E.push(armar('Resolver problemas', 'Desarrolla \\((2x+5)^2\\).',
      [{ t: '\\(4x^2+20x+25\\)', err: null },
       { t: '\\(2x^2+20x+25\\)', err: 'El cuadrado del primero es \\((2x)^2=4x^2\\), no \\(2x^2\\).' },
       { t: '\\(4x^2+10x+25\\)', err: 'El doble producto es \\(2\\cdot2x\\cdot5=20x\\), no \\(10x\\).' },
       { t: '\\(4x^2+25\\)', err: 'Falta el doble producto \\(2\\cdot2x\\cdot5=20x\\).' }],
      'Correcto. \\((2x+5)^2=(2x)^2+2\\cdot2x\\cdot5+5^2=4x^2+20x+25\\).'));

    // P2 · cuadrado con fraccion (Resolver)
    E.push(armar('Resolver problemas', 'Desarrolla \\(\\left(2-\\tfrac{1}{2x}\\right)^2\\).',
      [{ t: '\\(4-\\tfrac{2}{x}+\\tfrac{1}{4x^2}\\)', err: null },
       { t: '\\(4-\\tfrac{4}{x}+\\tfrac{1}{4x^2}\\)', err: 'El doble producto es \\(2\\cdot2\\cdot\\tfrac{1}{2x}=\\tfrac{2}{x}\\), no \\(\\tfrac{4}{x}\\).' },
       { t: '\\(4+\\tfrac{2}{x}+\\tfrac{1}{4x^2}\\)', err: 'Es un cuadrado de RESTA: el doble producto va con signo \\(-\\): \\(-\\tfrac{2}{x}\\).' },
       { t: '\\(4-\\tfrac{2}{x}+\\tfrac{1}{2x^2}\\)', err: 'El cuadrado del segundo es \\(\\left(\\tfrac{1}{2x}\\right)^2=\\tfrac{1}{4x^2}\\), no \\(\\tfrac{1}{2x^2}\\).' }],
      'Correcto. \\(2^2-2\\cdot2\\cdot\\tfrac{1}{2x}+\\left(\\tfrac{1}{2x}\\right)^2=4-\\tfrac{2}{x}+\\tfrac{1}{4x^2}\\).'));

    // P3 · cuadrado mas termino lineal (Resolver)
    E.push(armar('Resolver problemas', 'Reduce \\((b+1)^2-5(b+2)\\).',
      [{ t: '\\(b^2-3b-9\\)', err: null },
       { t: '\\(b^2-5b+11\\)', err: 'Desarrolla: \\(b^2+2b+1-5b-10=b^2-3b-9\\).' },
       { t: '\\(b^2-3b+3\\)', err: 'El término libre es \\(1-10=-9\\), no \\(+3\\).' },
       { t: '\\(b^2-5b+3\\)', err: 'Los \\(b\\): \\(+2b-5b=-3b\\); el libre: \\(1-10=-9\\). Da \\(b^2-3b-9\\).' }],
      'Correcto. \\((b+1)^2=b^2+2b+1\\); \\(-5(b+2)=-5b-10\\); total \\(b^2-3b-9\\).'));

    // P4 · cubo de binomio (Resolver)
    E.push(armar('Resolver problemas', 'Desarrolla \\((1+3y)^3\\).',
      [{ t: '\\(1+9y+27y^2+27y^3\\)', err: null },
       { t: '\\(1+3y^3\\)', err: 'El cubo de un binomio tiene 4 términos: \\(a^3+3a^2b+3ab^2+b^3\\).' },
       { t: '\\(1+9y+9y^2+27y^3\\)', err: 'El tercer término es \\(3\\cdot1\\cdot(3y)^2=27y^2\\), no \\(9y^2\\).' },
       { t: '\\(1+6y+27y^2+27y^3\\)', err: 'El segundo término es \\(3\\cdot1^2\\cdot3y=9y\\), no \\(6y\\).' }],
      'Correcto. \\((1+3y)^3=1+3\\cdot3y+3\\cdot(3y)^2+(3y)^3=1+9y+27y^2+27y^3\\).'));

    // P5 · suma por diferencia con raiz (Representar)
    E.push(armar('Representar', 'Desarrolla \\((m-\\sqrt3)(m+\\sqrt3)\\).',
      [{ t: '\\(m^2-3\\)', err: null },
       { t: '\\(m^2-2\\sqrt3-3\\)', err: 'Es suma por su diferencia: los términos centrales se cancelan. \\(m^2-(\\sqrt3)^2=m^2-3\\).' },
       { t: '\\(m^2-2\\sqrt3\\)', err: 'El cuadrado de \\(\\sqrt3\\) es 3: \\(m^2-3\\).' },
       { t: '\\(m^2+3\\)', err: 'La suma por su diferencia RESTA los cuadrados: \\(m^2-(\\sqrt3)^2=m^2-3\\).' }],
      'Correcto. \\((m-\\sqrt3)(m+\\sqrt3)=m^2-(\\sqrt3)^2=m^2-3\\).'));

    // P6 · suma por diferencia con potencias (Resolver)
    E.push(armar('Resolver problemas', 'Desarrolla \\((4p^3-6q^5)(4p^3+6q^5)\\).',
      [{ t: '\\(16p^6-36q^{10}\\)', err: null },
       { t: '\\(36p^6-36q^{10}\\)', err: 'El cuadrado del primero es \\((4p^3)^2=16p^6\\), no \\(36p^6\\).' },
       { t: '\\(16p^3-36q^5\\)', err: 'Al elevar al cuadrado los exponentes se DUPLICAN: \\((4p^3)^2=16p^6\\).' },
       { t: '\\(16p^6+48p^3q^5-36q^{10}\\)', err: 'En suma por diferencia los términos centrales se cancelan: \\(16p^6-36q^{10}\\).' }],
      'Correcto. \\((4p^3)^2-(6q^5)^2=16p^6-36q^{10}\\).'));

    // P7 · equivalencia (Argumentar)
    E.push(armar('Argumentar', '¿Es cierto que \\((x-y)^2+4xy=(x+y)^2\\)?',
      [{ t: 'Sí: ambas dan \\(x^2+2xy+y^2\\).', err: null },
       { t: 'No: son distintas.', err: 'Desarrolla: \\((x-y)^2+4xy=x^2-2xy+y^2+4xy=x^2+2xy+y^2=(x+y)^2\\).' },
       { t: 'Sí, pero solo si \\(x=y\\).', err: 'Es una identidad: vale para todo \\(x,y\\), porque \\(-2xy+4xy=2xy\\).' },
       { t: 'No: falta un término.', err: 'No falta nada: \\(x^2-2xy+y^2+4xy=x^2+2xy+y^2\\), exactamente \\((x+y)^2\\).' }],
      'Correcto. \\((x-y)^2+4xy=x^2-2xy+y^2+4xy=x^2+2xy+y^2=(x+y)^2\\).'));

    // P8 · binomio termino comun con signo (Representar)
    E.push(armar('Representar', 'Desarrolla \\((x+5)(x-2)\\).',
      [{ t: '\\(x^2+3x-10\\)', err: null },
       { t: '\\(x^2+7x+10\\)', err: 'Con un signo negativo: la suma es \\(5+(-2)=3\\) y el producto \\(5\\cdot(-2)=-10\\).' },
       { t: '\\(x^2-3x-10\\)', err: 'La suma de los términos es \\(5+(-2)=+3\\): \\(+3x\\).' },
       { t: '\\(x^2+3x+10\\)', err: 'El producto \\(5\\cdot(-2)=-10\\) es negativo: término libre \\(-10\\).' }],
      'Correcto. \\((x+a)(x+b)=x^2+(a+b)x+ab\\) con \\(a=5,b=-2\\): \\(x^2+3x-10\\).'));

    return E;
  }
};
</script>
