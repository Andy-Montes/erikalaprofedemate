<!DOCTYPE html>

<title>Flash Mate · U08.A.2b · Dominio, recorrido y codominio</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U08.A.2b', eje: 'E2', ejeNombre: 'ÁLGEBRA Y FUNCIONES', unidad: 'U08', unidadNum: '08', subunidad: 'A', nivel: 'b',
  titulo: 'Dominio, recorrido y codominio',
  sub: 'Pre-imágenes e imágenes · dominio de funciones reales',
  HAB_E: ['Representar', 'Representar', 'Resolver problemas', 'Resolver problemas', 'Argumentar', 'Resolver problemas', 'Argumentar', 'Modelar'],
  generar: function () {
    var E = [];

    // P1 · dominio (Representar)
    E.push(armar('Representar', 'El dominio de una función es el conjunto de:',
      [{ t: 'Las pre-imágenes (los valores de \\(x\\)).', err: null },
       { t: 'Las imágenes (los valores de \\(y\\)).', err: 'Esas forman el RECORRIDO. El dominio son las pre-imágenes (los \\(x\\)).' },
       { t: 'Todos los elementos del conjunto de llegada.', err: 'Ese es el CODOMINIO. El dominio son los \\(x\\) (pre-imágenes).' },
       { t: 'El mayor valor de \\(y\\).', err: 'No es un solo valor: el dominio es el conjunto de todas las pre-imágenes \\(x\\).' }],
      'Correcto. El dominio es el conjunto de pre-imágenes (los valores de \\(x\\)).'));

    // P2 · recorrido (Representar)
    E.push(armar('Representar', 'El recorrido de una función es el conjunto de:',
      [{ t: 'Las imágenes (los valores de \\(y\\)).', err: null },
       { t: 'Las pre-imágenes (los \\(x\\)).', err: 'Esas forman el DOMINIO. El recorrido son las imágenes (los \\(y\\)).' },
       { t: 'Todos los elementos del conjunto de llegada.', err: 'Ese es el CODOMINIO. El recorrido son solo los \\(y\\) que SÍ se alcanzan.' },
       { t: 'El coeficiente de la función.', err: 'No: el recorrido es el conjunto de imágenes (los \\(y\\) obtenidos).' }],
      'Correcto. El recorrido es el conjunto de imágenes (los valores de \\(y\\) alcanzados).'));

    // P3 · calcular recorrido (Resolver) — PDF
    E.push(armar('Resolver problemas', 'Sea \\(f(x)=2x-1\\) con dominio \\(\\{-1,0,1,2\\}\\). ¿Cuál es su recorrido?',
      [{ t: '\\(\\{-3,-1,1,3\\}\\)', err: null },
       { t: '\\(\\{-1,0,1,2\\}\\)', err: 'Ese es el DOMINIO. Aplica \\(f\\): \\(f(-1)=-3,\\,f(0)=-1,\\,f(1)=1,\\,f(2)=3\\).' },
       { t: '\\(\\{-2,-1,0,1\\}\\)', err: 'Evalúa bien: \\(f(-1)=2(-1)-1=-3\\), etc. Recorrido \\(\\{-3,-1,1,3\\}\\).' },
       { t: '\\(\\{-3,-2,-1,0,1,2,3\\}\\)', err: 'Ese es el CODOMINIO (todo \\(B\\)); el recorrido son SOLO las imágenes: \\(\\{-3,-1,1,3\\}\\).' }],
      'Correcto. \\(f(-1)=-3,\\,f(0)=-1,\\,f(1)=1,\\,f(2)=3\\): recorrido \\(\\{-3,-1,1,3\\}\\).'));

    // P4 · imagen de un valor (Resolver)
    E.push(armar('Resolver problemas', 'Sea \\(f(x)=2x-1\\). ¿Cuál es la imagen de \\(x=2\\)?',
      [{ t: '\\(3\\)', err: null },
       { t: '\\(2\\)', err: 'La imagen es \\(f(2)=2\\cdot2-1=3\\), no el propio 2.' },
       { t: '\\(-3\\)', err: '\\(2\\cdot2-1=3\\) (positivo).' },
       { t: '\\(5\\)', err: 'Resta el 1: \\(4-1=3\\).' }],
      'Correcto. La imagen de 2 es \\(f(2)=2\\cdot2-1=3\\).'));

    // P5 · codominio vs recorrido (Argumentar)
    E.push(armar('Argumentar', 'Una función tiene codominio \\(\\{-3,-2,-1,0,1,2,3\\}\\) y solo alcanza los valores \\(\\{-3,-1,1,3\\}\\). ¿Qué relación hay entre recorrido y codominio?',
      [{ t: 'El recorrido está contenido en el codominio.', err: null },
       { t: 'Son siempre iguales.', err: 'No siempre: aquí el recorrido \\(\\{-3,-1,1,3\\}\\) es solo una parte del codominio.' },
       { t: 'El codominio está contenido en el recorrido.', err: 'Es al revés: el recorrido (lo alcanzado) está DENTRO del codominio (todo el conjunto de llegada).' },
       { t: 'No tienen relación.', err: 'Sí: el recorrido siempre es un subconjunto del codominio.' }],
      'Correcto. El recorrido (valores alcanzados) siempre está contenido en el codominio.'));

    // P6 · dominio con denominador (Resolver) — PDF
    E.push(armar('Resolver problemas', '¿Cuál es el dominio de \\(f(x)=\\tfrac{x+2}{3x}\\) en los reales?',
      [{ t: 'Todos los reales, excepto \\(x=0\\).', err: null },
       { t: 'Todos los reales.', err: 'Si \\(x=0\\), el denominador \\(3x=0\\) y no se puede dividir. Dominio: \\(\\mathbb{R}-\\{0\\}\\).' },
       { t: 'Solo \\(x=0\\).', err: 'Justo \\(x=0\\) es el ÚNICO valor que se EXCLUYE (anula el denominador).' },
       { t: 'Todos los reales, excepto \\(x=2\\).', err: 'Se excluye donde el DENOMINADOR se anula (\\(3x=0\\Rightarrow x=0\\)), no el numerador.' }],
      'Correcto. \\(3x\\neq0\\Rightarrow x\\neq0\\): dominio \\(\\mathbb{R}-\\{0\\}\\).'));

    // P7 · dominio con raíz (Argumentar)
    E.push(armar('Argumentar', '¿Cuál es el dominio de \\(f(x)=\\sqrt{x-4}\\) en los reales?',
      [{ t: 'Todos los reales con \\(x\\geq4\\).', err: null },
       { t: 'Todos los reales con \\(x>4\\).', err: 'Casi: como \\(\\sqrt{0}=0\\) SÍ existe, el 4 se incluye: \\(x\\geq4\\).' },
       { t: 'Todos los reales.', err: 'Si \\(x-4<0\\) la raíz no es real; se necesita \\(x-4\\geq0\\Rightarrow x\\geq4\\).' },
       { t: 'Todos los reales con \\(x\\leq4\\).', err: 'El subradical debe ser \\(\\geq0\\): \\(x-4\\geq0\\Rightarrow x\\geq4\\), no \\(\\leq\\).' }],
      'Correcto. \\(x-4\\geq0\\Rightarrow x\\geq4\\) (incluye el 4, pues \\(\\sqrt0=0\\) existe).'));

    // P8 · dominio en contexto (Modelar)
    E.push(armar('Modelar', 'En un problema, \\(x\\) representa la cantidad de personas. ¿Qué valores puede tomar el dominio?',
      [{ t: 'Números enteros no negativos (0, 1, 2, …).', err: null },
       { t: 'Todos los números reales.', err: 'No se puede tener 2,5 personas ni \\(-3\\): el dominio son enteros no negativos.' },
       { t: 'Solo números negativos.', err: 'Una cantidad de personas no es negativa: enteros \\(\\geq0\\).' },
       { t: 'Cualquier fracción positiva.', err: 'Las personas se cuentan de a una: enteros no negativos, no fracciones.' }],
      'Correcto. El contexto restringe el dominio a enteros no negativos (0, 1, 2, …).'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
