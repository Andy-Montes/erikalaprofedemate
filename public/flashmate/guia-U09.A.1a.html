<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U09.A.1a · Resolver ecuaciones cuadráticas</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U09.A.1a', eje: 'E2', ejeNombre: 'ÁLGEBRA Y FUNCIONES', unidad: 'U09', unidadNum: '09', subunidad: 'A', nivel: 'a',
  titulo: 'Resolver ecuaciones cuadráticas',
  sub: 'Factorización · casos incompletos · propiedad del producto cero',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Resolver problemas', 'Resolver problemas', 'Argumentar', 'Representar', 'Modelar', 'Resolver problemas'],
  generar: function () {
    var E = [];

    // P1 · factorizar simple (Resolver)
    E.push(armar('Resolver problemas', 'Resuelve \\(x^2-5x+6=0\\).',
      [{ t: '\\(x=2\\) y \\(x=3\\)', err: null },
       { t: '\\(x=-2\\) y \\(x=-3\\)', err: 'Los factores son \\((x-2)(x-3)\\); al igualar a 0 quedan \\(x=2\\) y \\(x=3\\) (positivos).' },
       { t: '\\(x=5\\) y \\(x=6\\)', err: 'Se buscan dos números que multiplicados den 6 y sumados 5: son 2 y 3, no 5 y 6.' },
       { t: '\\(x=1\\) y \\(x=6\\)', err: '\\(1\\cdot6=6\\) pero \\(1+6=7\\neq5\\). Los correctos: 2 y 3.' }],
      'Correcto. \\((x-2)(x-3)=0\\Rightarrow x=2\\lor x=3\\).'));

    // P2 · factorizar con negativo (Resolver)
    E.push(armar('Resolver problemas', 'Resuelve \\(x^2-x-20=0\\).',
      [{ t: '\\(x=5\\) y \\(x=-4\\)', err: null },
       { t: '\\(x=-5\\) y \\(x=4\\)', err: 'Esas serían raíces de \\(x^2+x-20\\). Aquí \\(x^2-x-20=(x-5)(x+4)\\Rightarrow x=5\\lor x=-4\\).' },
       { t: '\\(x=10\\) y \\(x=-2\\)', err: '\\(10\\cdot(-2)=-20\\) pero no dan el término central. Correcto: \\(5\\) y \\(-4\\).' },
       { t: '\\(x=20\\) y \\(x=1\\)', err: 'El producto es \\(-20\\) y las raíces suman \\(1\\): son \\(5\\) y \\(-4\\).' }],
      'Correcto. \\(x^2-x-20=(x-5)(x+4)=0\\Rightarrow x=5\\lor x=-4\\).'));

    // P3 · incompleta ax^2+c=0 (Resolver)
    E.push(armar('Resolver problemas', 'Resuelve \\(3x^2-12=0\\).',
      [{ t: '\\(x=\\pm2\\)', err: null },
       { t: '\\(x=\\pm4\\)', err: '\\(3x^2=12\\Rightarrow x^2=4\\Rightarrow x=\\pm2\\), no \\(\\pm4\\).' },
       { t: '\\(x=2\\)', err: 'Hay DOS soluciones: \\(x^2=4\\Rightarrow x=\\pm2\\) (también \\(-2\\)).' },
       { t: '\\(x=\\pm\\sqrt{12}\\)', err: 'Primero divide por 3: \\(x^2=4\\Rightarrow x=\\pm2\\).' }],
      'Correcto. \\(3x^2-12=0\\Rightarrow x^2=4\\Rightarrow x=\\pm2\\).'));

    // P4 · incompleta ax^2+bx=0 (Resolver)
    E.push(armar('Resolver problemas', 'Resuelve \\(x^2-5x=0\\).',
      [{ t: '\\(x=0\\) y \\(x=5\\)', err: null },
       { t: '\\(x=5\\)', err: 'Hay dos: al factorizar \\(x(x-5)=0\\), una solución es \\(x=0\\) y otra \\(x=5\\).' },
       { t: '\\(x=-5\\) y \\(x=0\\)', err: '\\(x-5=0\\Rightarrow x=5\\) (positivo). Soluciones: 0 y 5.' },
       { t: '\\(x=5\\) y \\(x=-5\\)', err: 'Factor común \\(x\\): \\(x(x-5)=0\\Rightarrow x=0\\lor x=5\\).' }],
      'Correcto. \\(x^2-5x=x(x-5)=0\\Rightarrow x=0\\lor x=5\\).'));

    // P5 · propiedad producto cero (Argumentar)
    E.push(armar('Argumentar', 'Al factorizar una ecuación se obtiene \\((x-4)(x+1)=0\\). ¿Por qué las soluciones son \\(x=4\\) y \\(x=-1\\)?',
      [{ t: 'Porque si un producto es 0, al menos uno de los factores es 0.', err: null },
       { t: 'Porque se suman los factores.', err: 'No se suman: un producto igual a 0 obliga a que un factor sea 0: \\(x-4=0\\) o \\(x+1=0\\).' },
       { t: 'Porque \\(4\\) y \\(-1\\) están en los paréntesis.', err: 'Ojo con el signo: \\(x-4=0\\Rightarrow x=4\\) y \\(x+1=0\\Rightarrow x=-1\\).' },
       { t: 'Porque toda ecuación tiene dos soluciones.', err: 'No siempre; aquí, por la propiedad del producto cero, cada factor da una solución.' }],
      'Correcto. Un producto \\(=0\\) obliga a que un factor sea \\(0\\): \\(x-4=0\\lor x+1=0\\).'));

    // P6 · cuadrado perfecto (Representar)
    E.push(armar('Representar', 'Resuelve \\(x^2+8x+16=0\\).',
      [{ t: '\\(x=-4\\) (solución doble)', err: null },
       { t: '\\(x=4\\)', err: '\\((x+4)^2=0\\Rightarrow x+4=0\\Rightarrow x=-4\\) (no \\(+4\\)).' },
       { t: '\\(x=-4\\) y \\(x=4\\)', err: 'Es un cuadrado perfecto \\((x+4)^2\\): tiene UNA sola solución, \\(x=-4\\).' },
       { t: '\\(x=-8\\)', err: '\\((x+4)^2=0\\Rightarrow x=-4\\), no \\(-8\\).' }],
      'Correcto. \\(x^2+8x+16=(x+4)^2=0\\Rightarrow x=-4\\) (raíz doble).'));

    // P7 · plantear área (Modelar)
    E.push(armar('Modelar', 'Un rectángulo tiene base \\(x\\) y altura \\(x-2\\), y su área es 15. ¿Qué ecuación permite hallar \\(x\\)?',
      [{ t: '\\(x^2-2x-15=0\\)', err: null },
       { t: '\\(x^2-2x+15=0\\)', err: 'El área pasa restando: \\(x(x-2)=15\\Rightarrow x^2-2x-15=0\\) (con \\(-15\\)).' },
       { t: '\\(x^2-2x=15\\)', err: 'Para resolver se iguala a 0: \\(x^2-2x-15=0\\).' },
       { t: '\\(2x-2=15\\)', err: 'El área es un PRODUCTO, no una suma: \\(x(x-2)=x^2-2x\\).' }],
      'Correcto. Área \\(=x(x-2)=15\\Rightarrow x^2-2x-15=0\\).'));

    // P8 · resolver el planteo (Resolver)
    E.push(armar('Resolver problemas', 'Resuelve \\(x^2-2x-15=0\\) (la base del rectángulo anterior).',
      [{ t: '\\(x=5\\) o \\(x=-3\\)', err: null },
       { t: '\\(x=3\\) o \\(x=-5\\)', err: '\\((x-5)(x+3)=0\\Rightarrow x=5\\lor x=-3\\).' },
       { t: '\\(x=15\\) o \\(x=1\\)', err: 'Busca dos números con producto \\(-15\\) y suma \\(-2\\): \\(-5\\) y \\(3\\Rightarrow x=5,\\,-3\\).' },
       { t: 'No tiene solución', err: 'Sí: \\((x-5)(x+3)=0\\Rightarrow x=5\\lor x=-3\\).' }],
      'Correcto. \\((x-5)(x+3)=0\\Rightarrow x=5\\lor x=-3\\) (la base es \\(x=5\\), positiva).'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
