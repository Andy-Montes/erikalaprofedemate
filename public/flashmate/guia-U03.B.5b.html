<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U03.B.5b · Raíces</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U03.B.5b', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U03', unidadNum: '03', subunidad: 'B', nivel: 'b',
  titulo: 'Raíces',
  sub: 'Propiedades · raíz de raíz · raíz como potencia · descomposición',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Representar', 'Representar', 'Resolver problemas', 'Resolver problemas', 'Argumentar', 'Resolver problemas'],
  generar: function () {
    var E = [];

    // P1 · producto igual indice (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\sqrt[3]{3}\\cdot\\sqrt[3]{9}\\).',
      [{ t: '\\(3\\)', err: null },
       { t: '\\(\\sqrt[3]{12}\\)', err: 'Con igual índice se MULTIPLICAN los subradicales, no se suman: \\(\\sqrt[3]{3\\cdot9}=\\sqrt[3]{27}=3\\).' },
       { t: '\\(\\sqrt[3]{27}\\)', err: 'Vas bien, pero \\(\\sqrt[3]{27}\\) tiene valor exacto: \\(3\\).' },
       { t: '\\(27\\)', err: 'Falta sacar la raíz cúbica: \\(\\sqrt[3]{27}=3\\).' }],
      'Correcto. Igual índice: \\(\\sqrt[3]{3}\\cdot\\sqrt[3]{9}=\\sqrt[3]{27}=3\\).'));

    // P2 · division igual indice (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\sqrt[3]{32}\\div\\sqrt[3]{4}\\).',
      [{ t: '\\(2\\)', err: null },
       { t: '\\(\\sqrt[3]{28}\\)', err: 'Con igual índice se DIVIDEN los subradicales, no se restan: \\(\\sqrt[3]{32:4}=\\sqrt[3]{8}=2\\).' },
       { t: '\\(8\\)', err: 'Falta la raíz cúbica: \\(\\sqrt[3]{8}=2\\).' },
       { t: '\\(\\sqrt[3]{128}\\)', err: 'Se dividen los subradicales, no se multiplican: \\(\\sqrt[3]{32:4}=\\sqrt[3]{8}=2\\).' }],
      'Correcto. Igual índice: \\(\\sqrt[3]{32}\\div\\sqrt[3]{4}=\\sqrt[3]{8}=2\\).'));

    // P3 · raiz de raiz (Representar)
    E.push(armar('Representar', 'Escribe \\(\\sqrt{\\sqrt[3]{7}}\\) como una sola raíz.',
      [{ t: '\\(\\sqrt[6]{7}\\)', err: null },
       { t: '\\(\\sqrt[5]{7}\\)', err: 'Los índices se MULTIPLICAN, no se suman: \\(2\\cdot3=6\\), da \\(\\sqrt[6]{7}\\).' },
       { t: '\\(\\sqrt[3]{7}\\)', err: 'Hay dos raíces: sus índices se multiplican, \\(2\\cdot3=6\\): \\(\\sqrt[6]{7}\\).' },
       { t: '\\(\\sqrt[1{,}5]{7}\\)', err: 'Los índices se multiplican, no se dividen: \\(2\\cdot3=6\\), \\(\\sqrt[6]{7}\\).' }],
      'Correcto. Raíz de raíz: se mantiene el subradical y se multiplican los índices, \\(\\sqrt{\\sqrt[3]{7}}=\\sqrt[6]{7}\\).'));

    // P4 · potencia -> raiz (Representar)
    E.push(armar('Representar', 'Escribe \\(2^{\\frac{5}{2}}\\) en forma de raíz.',
      [{ t: '\\(\\sqrt{2^5}\\)', err: null },
       { t: '\\(\\sqrt[5]{2^2}\\)', err: 'El denominador del exponente es el índice y el numerador el exponente del subradical: \\(2^{\\frac{5}{2}}=\\sqrt{2^5}\\).' },
       { t: '\\(\\sqrt[5]{2}\\)', err: 'El numerador 5 queda como exponente del subradical: \\(\\sqrt{2^5}\\).' },
       { t: '\\(\\sqrt{2}\\)', err: 'Falta el exponente 5 en el subradical: \\(2^{\\frac{5}{2}}=\\sqrt{2^5}\\).' }],
      'Correcto. \\(a^{\\frac{y}{x}}=\\sqrt[x]{a^y}\\): \\(2^{\\frac{5}{2}}=\\sqrt{2^5}\\) (índice 2, exponente 5).'));

    // P5 · descomposicion (Resolver)
    E.push(armar('Resolver problemas', 'Simplifica \\(\\sqrt{75}\\) extrayendo el factor exacto.',
      [{ t: '\\(5\\sqrt{3}\\)', err: null },
       { t: '\\(3\\sqrt{5}\\)', err: 'Descompón buscando el cuadrado: \\(75=25\\cdot3\\), y \\(\\sqrt{25}=5\\): \\(5\\sqrt{3}\\).' },
       { t: '\\(25\\sqrt{3}\\)', err: 'El 25 SALE como su raíz \\(5\\), no queda como 25: \\(5\\sqrt{3}\\).' },
       { t: 'No se puede simplificar', err: 'Sí se puede: \\(75=25\\cdot3\\) y 25 es cuadrado perfecto: \\(5\\sqrt{3}\\).' }],
      'Correcto. \\(\\sqrt{75}=\\sqrt{25\\cdot3}=\\sqrt{5^2\\cdot3}=5\\sqrt{3}\\).'));

    // P6 · composicion (Resolver)
    E.push(armar('Resolver problemas', 'Ingresa el factor a la raíz: \\(2\\cdot\\sqrt[3]{4}=\\)',
      [{ t: '\\(\\sqrt[3]{32}\\)', err: null },
       { t: '\\(\\sqrt[3]{8}\\)', err: 'El factor entra elevado al índice y se MULTIPLICA por el subradical: \\(\\sqrt[3]{2^3\\cdot4}=\\sqrt[3]{32}\\).' },
       { t: '\\(\\sqrt[6]{4}\\)', err: 'El índice no cambia; el factor 2 entra como \\(2^3=8\\): \\(\\sqrt[3]{8\\cdot4}=\\sqrt[3]{32}\\).' },
       { t: '\\(8\\sqrt[3]{4}\\)', err: 'Para ingresarlo hay que elevarlo al índice: \\(2^3=8\\) dentro, \\(\\sqrt[3]{8\\cdot4}=\\sqrt[3]{32}\\).' }],
      'Correcto. \\(a\\cdot\\sqrt[n]{b}=\\sqrt[n]{a^n\\cdot b}\\): \\(2\\cdot\\sqrt[3]{4}=\\sqrt[3]{2^3\\cdot4}=\\sqrt[3]{32}\\).'));

    // P7 · suma de raices (Argumentar)
    E.push(armar('Argumentar', '¿Es cierto que \\(\\sqrt{2}+\\sqrt{3}=\\sqrt{5}\\)?',
      [{ t: 'No: no se pueden sumar (distinto subradical).', err: null },
       { t: 'Sí, se suman los subradicales.', err: 'No hay propiedad para sumar raíces: \\(\\sqrt{2}+\\sqrt{3}\\) queda igual (subradicales distintos).' },
       { t: 'No: es \\(\\sqrt{6}\\).', err: '\\(\\sqrt{6}\\) sería el PRODUCTO \\(\\sqrt{2}\\cdot\\sqrt{3}\\), no la suma. La suma no se simplifica.' },
       { t: 'No: es \\(2\\sqrt{5}\\).', err: 'No se combinan: solo se suman raíces con igual índice y MISMO subradical.' }],
      'Correcto. Solo se suman raíces con igual índice y el MISMO subradical. \\(\\sqrt{2}+\\sqrt{3}\\) no se puede reducir.'));

    // P8 · suma/resta con descomposicion (Resolver)
    E.push(armar('Resolver problemas', 'Reduce \\(\\sqrt{12}+\\sqrt{18}-\\sqrt{32}\\).',
      [{ t: '\\(2\\sqrt{3}-\\sqrt{2}\\)', err: null },
       { t: '\\(2\\sqrt{3}+7\\sqrt{2}\\)', err: 'Los términos con \\(\\sqrt2\\) se restan: \\(3\\sqrt2-4\\sqrt2=-\\sqrt2\\). Queda \\(2\\sqrt3-\\sqrt2\\).' },
       { t: '\\(\\sqrt{-2}\\)', err: 'No se suma dentro de la raíz. Descompón: \\(2\\sqrt3+3\\sqrt2-4\\sqrt2=2\\sqrt3-\\sqrt2\\).' },
       { t: '\\(-2\\sqrt{3}+\\sqrt{2}\\)', err: 'Revisa signos: el \\(2\\sqrt3\\) queda positivo y \\(3\\sqrt2-4\\sqrt2=-\\sqrt2\\).' }],
      'Correcto. \\(\\sqrt{12}=2\\sqrt3\\), \\(\\sqrt{18}=3\\sqrt2\\), \\(\\sqrt{32}=4\\sqrt2\\): \\(2\\sqrt3+3\\sqrt2-4\\sqrt2=2\\sqrt3-\\sqrt2\\).'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
</html>
