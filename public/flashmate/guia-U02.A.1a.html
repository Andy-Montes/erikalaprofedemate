<title>Flash Mate · U02.A.1a · Porcentajes</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U02.A.1a', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U02', unidadNum: '02', subunidad: 'A', nivel: 'a',
  titulo: 'Porcentajes',
  sub: 'Concepto · Equivalencias · %↔fracción↔decimal',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Representar', 'Representar', 'Modelar', 'Modelar', 'Argumentar', 'Argumentar'],
  generar: function () {
    var E = [];

    // P1 · 10% mental (Resolver)
    var A = rnd([{ n: 450, r: 45 }, { n: 300, r: 30 }, { n: 80, r: 8 }]);
    E.push(armar('Resolver problemas', '¿Cuánto es el 10% de ' + A.n + '?',
      [{ t: '' + A.r, err: null },
       { t: '' + (A.r / 10), err: 'El 10% es dividir por 10, no por 100: ' + A.n + ' ÷ 10 = ' + A.r + '.' },
       { t: '' + A.n, err: 'El 10% es una PARTE del total, no el total completo.' },
       { t: '' + (A.r * 2), err: 'Eso sería el 20%. El 10% de ' + A.n + ' es ' + A.r + '.' }],
      'Correcto. 10% = \\(\\tfrac{1}{10}\\): ' + A.n + ' ÷ 10 = ' + A.r + '.'));

    // P2 · 25% con equivalencia 1/4 (Resolver)
    var B = rnd([{ n: 80, r: 20 }, { n: 120, r: 30 }, { n: 200, r: 50 }]);
    E.push(armar('Resolver problemas', '¿Cuánto es el 25% de ' + B.n + '?',
      [{ t: '' + B.r, err: null },
       { t: '25', err: 'El 25% no significa "25 unidades"; es \\(\\tfrac14\\) de ' + B.n + ' = ' + B.r + '.' },
       { t: '' + (B.n / 2), err: 'Eso es el 50%. El 25% es la mitad de esa mitad: ' + B.r + '.' },
       { t: '' + (B.n / 20), err: 'Revisa: 25% = \\(\\tfrac14\\), o sea ' + B.n + ' ÷ 4 = ' + B.r + '.' }],
      'Correcto. 25% = \\(\\tfrac14\\): ' + B.n + ' ÷ 4 = ' + B.r + '.'));

    // P3 · % a decimal (Representar)
    var C = rnd([{ p: 40, d: '0,4' }, { p: 75, d: '0,75' }, { p: 8, d: '0,08' }]);
    E.push(armar('Representar', '¿Qué número decimal representa el ' + C.p + '%?',
      [{ t: C.d, err: null },
       { t: '' + C.p, err: 'Ese es el número sin transformar; el ' + C.p + '% = \\(\\tfrac{' + C.p + '}{100}\\) = ' + C.d + '.' },
       { t: (C.p / 100 * 10).toString().replace('.', ',') + '0', err: 'Al dividir por 100 la coma corre dos lugares a la izquierda: ' + C.d + '.' },
       { t: (C.p / 10000).toString().replace('.', ','), err: 'Eso sería el ' + (C.p / 100) + '%. El ' + C.p + '% = ' + C.d + '.' }],
      'Correcto. ' + C.p + '% = \\(\\tfrac{' + C.p + '}{100}\\) = ' + C.d + '.'));

    // P4 · % a fracción irreducible (Representar)
    var D = rnd([
      { p: 25, f: '\\tfrac14', otro: '\\tfrac{2}{5}', otroP: '40' },
      { p: 20, f: '\\tfrac15', otro: '\\tfrac{1}{2}', otroP: '50' },
      { p: 50, f: '\\tfrac12', otro: '\\tfrac{1}{5}', otroP: '20' }
    ]);
    E.push(armar('Representar', '¿A qué fracción irreducible equivale el ' + D.p + '%?',
      [{ t: '\\(' + D.f + '\\)', err: null },
       { t: '\\(\\tfrac{' + D.p + '}{100}\\)', err: 'Está bien planteada, pero falta simplificar: \\(\\tfrac{' + D.p + '}{100}=' + D.f + '\\).' },
       { t: '\\(\\tfrac{100}{' + D.p + '}\\)', err: 'La fracción es "parte sobre 100", no al revés: ' + D.p + '% = \\(' + D.f + '\\).' },
       { t: '\\(' + D.otro + '\\)', err: '\\(' + D.otro + '\\) equivale al ' + D.otroP + '%, no al ' + D.p + '%.' }],
      'Correcto. ' + D.p + '% = \\(\\tfrac{' + D.p + '}{100}=' + D.f + '\\).'));

    // P5 · contexto lentes (Modelar)
    var G = rnd([{ tot: 30, p: 20, r: 6 }, { tot: 40, p: 25, r: 10 }, { tot: 50, p: 20, r: 10 }]);
    E.push(armar('Modelar', 'En un curso de ' + G.tot + ' estudiantes, el ' + G.p + '% usa lentes. ¿Cuántos usan lentes?',
      [{ t: '' + G.r, err: null },
       { t: '' + G.p, err: 'El ' + G.p + '% no es "' + G.p + ' estudiantes"; es \\(\\tfrac{' + G.p + '}{100}\\) de ' + G.tot + ' = ' + G.r + '.' },
       { t: '' + G.tot, err: 'Ese es el curso completo; solo una parte usa lentes: ' + G.r + '.' },
       { t: '' + (G.r + G.p), err: 'No se suma el porcentaje con el resultado. La respuesta es \\(\\tfrac{' + G.p + '}{100}\\cdot' + G.tot + '=' + G.r + '\\).' }],
      'Correcto. ' + G.p + '% de ' + G.tot + ' = \\(\\tfrac{' + G.p + '}{100}\\cdot' + G.tot + '=' + G.r + '\\) estudiantes.'));

    // P6 · contexto encuesta (Modelar)
    var H = rnd([{ tot: 200, p: 15, r: 30 }, { tot: 400, p: 10, r: 40 }, { tot: 300, p: 20, r: 60 }]);
    E.push(armar('Modelar', 'En una encuesta a ' + H.tot + ' personas, el ' + H.p + '% prefiere té. ¿Cuántas prefieren té?',
      [{ t: '' + H.r, err: null },
       { t: '' + H.p, err: 'El ' + H.p + '% no es "' + H.p + ' personas"; es \\(\\tfrac{' + H.p + '}{100}\\) de ' + H.tot + ' = ' + H.r + '.' },
       { t: '' + (H.tot + H.r), err: 'El resultado no puede superar el total (' + H.tot + '). Es una parte: ' + H.r + '.' },
       { t: '' + (H.r / 2), err: 'Revisa: \\(\\tfrac{' + H.p + '}{100}\\cdot' + H.tot + '=' + H.r + '\\).' }],
      'Correcto. ' + H.p + '% de ' + H.tot + ' = \\(\\tfrac{' + H.p + '}{100}\\cdot' + H.tot + '=' + H.r + '\\).'));

    // P7 · comparación (Argumentar)
    E.push(armar('Argumentar', '¿Qué es MAYOR: el 50% de 40 o el 25% de 100?',
      [{ t: 'El 25% de 100', err: null },
       { t: 'El 50% de 40', err: '50% de 40 = 20; 25% de 100 = 25. El segundo es mayor.' },
       { t: 'Son iguales', err: 'No: 50% de 40 = 20 y 25% de 100 = 25, son distintos.' },
       { t: 'Falta información', err: 'Con los datos basta: 20 contra 25.' }],
      'Correcto. 50% de 40 = 20 y 25% de 100 = 25. Un porcentaje mayor de una cantidad menor puede dar MENOS: aquí gana el 25% de 100.'));

    // P8 · significado del porcentaje (Argumentar)
    E.push(armar('Argumentar', '¿Cuál de las siguientes afirmaciones sobre porcentajes es CORRECTA?',
      [{ t: 'El 100% de una cantidad es la cantidad completa.', err: null },
       { t: 'El 50% siempre es igual a 50.', err: 'El 50% depende del total: el 50% de 80 es 40, no 50.' },
       { t: 'El 10% de 500 es mayor que el 10% de 800.', err: 'A igual porcentaje, un total mayor da una parte mayor: 50 < 80.' },
       { t: 'El 1% de una cantidad es dividirla en 10.', err: 'El 1% es dividir por 100, no por 10.' }],
      'Correcto. 100% = \\(\\tfrac{100}{100}=1\\), es decir la cantidad completa. El valor de un porcentaje siempre depende del total.'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
