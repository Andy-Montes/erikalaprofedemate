<!DOCTYPE html>

<title>Flash Mate · U02.A.2b · Porcentajes</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U02.A.2b', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U02', unidadNum: '02', subunidad: 'A', nivel: 'b',
  titulo: 'Porcentajes',
  sub: 'Caso 1 · Calcular el a% de b',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Modelar', 'Modelar', 'Representar', 'Representar', 'Argumentar', 'Argumentar'],
  generar: function () {
    var E = [];

    // P1 · a% de b (Resolver)
    var A = rnd([
      { a: 12, b: 240, r: '28,8', d1: '288', d2: '2,88', d3: '26' },
      { a: 30, b: 200, r: '60', d1: '600', d2: '6', d3: '170' }
    ]);
    E.push(armar('Resolver problemas', '¿Cuánto es el ' + A.a + '% de ' + A.b + '?',
      [{ t: A.r, err: null },
       { t: A.d1, err: 'Al dividir por 100 la coma corre dos lugares: \\(\\tfrac{' + A.a + '\\cdot' + A.b + '}{100}=' + A.r + '\\).' },
       { t: A.d2, err: 'Revisa la división por 100: el resultado es ' + A.r + '.' },
       { t: A.d3, err: 'No es una resta; es \\(\\tfrac{' + A.a + '\\cdot' + A.b + '}{100}=' + A.r + '\\).' }],
      'Correcto. El a% de b = \\(\\tfrac{a\\cdot b}{100}=\\tfrac{' + A.a + '\\cdot' + A.b + '}{100}=' + A.r + '\\).'));

    // P2 · a% de b (Resolver)
    var B = rnd([
      { a: 15, b: 80, r: '12', d1: '1.200', d2: '1,2', d3: '20' },
      { a: 8, b: 50, r: '4', d1: '400', d2: '0,4', d3: '6' }
    ]);
    E.push(armar('Resolver problemas', '¿Cuánto es el ' + B.a + '% de ' + B.b + '?',
      [{ t: B.r, err: null },
       { t: B.d1, err: 'Falta dividir por 100: \\(\\tfrac{' + B.a + '\\cdot' + B.b + '}{100}=' + B.r + '\\).' },
       { t: B.d2, err: 'Revisa la coma: el resultado es ' + B.r + '.' },
       { t: B.d3, err: 'El ' + B.a + '% de ' + B.b + ' es ' + B.r + '.' }],
      'Correcto. \\(\\tfrac{' + B.a + '\\cdot' + B.b + '}{100}=' + B.r + '\\).'));

    // P3 · propina (Modelar)
    E.push(armar('Modelar', 'La cuenta de un restaurante es $8.000 y se deja un 10% de propina. ¿Cuánto es la propina?',
      [{ t: '$800', err: null },
       { t: '$80', err: 'El 10% es dividir por 10: 8.000 ÷ 10 = 800.' },
       { t: '$8.000', err: 'Esa es la cuenta completa; la propina es una parte: $800.' },
       { t: '$1.600', err: 'Eso es el 20%. El 10% de 8.000 es $800.' }],
      'Correcto. 10% de 8.000 = 8.000 ÷ 10 = $800.'));

    // P4 · ahorro (Modelar)
    E.push(armar('Modelar', 'De un sueldo de $400.000 se ahorra el 15%. ¿Cuánto se ahorra?',
      [{ t: '$60.000', err: null },
       { t: '$6.000', err: 'Revisa la coma: \\(\\tfrac{15\\cdot400.000}{100}=60.000\\).' },
       { t: '$15.000', err: 'El 15% no es "15 mil"; es \\(\\tfrac{15}{100}\\cdot400.000=60.000\\).' },
       { t: '$340.000', err: 'Eso es lo que queda del sueldo, no lo ahorrado.' }],
      'Correcto. 15% de 400.000 = \\(\\tfrac{15}{100}\\cdot400.000=60.000\\).'));

    // P5 · multiplicador decimal (Representar)
    var C = rnd([
      { p: 35, d: '0,35', d1: '35', d2: '3,5', d3: '0,035', pm: '3,5' },
      { p: 60, d: '0,6', d1: '60', d2: '6,0', d3: '0,06', pm: '6' }
    ]);
    E.push(armar('Representar', 'Para calcular el ' + C.p + '% de una cantidad, ¿por qué número conviene multiplicarla?',
      [{ t: C.d, err: null },
       { t: C.d1, err: 'El ' + C.p + '% = \\(\\tfrac{' + C.p + '}{100}\\) = ' + C.d + ', no ' + C.d1 + '.' },
       { t: C.d2, err: 'La coma va dos lugares a la izquierda: ' + C.d + '.' },
       { t: C.d3, err: 'Ese sería el ' + C.pm + '%. El ' + C.p + '% = ' + C.d + '.' }],
      'Correcto. ' + C.p + '% = \\(\\tfrac{' + C.p + '}{100}\\) = ' + C.d + '; multiplicar por ' + C.d + ' da el ' + C.p + '%.'));

    // P6 · equivalencia con fracción (Representar)
    var G = rnd([
      { p: 50, n: 90, op: '90 ÷ 2', f: '\\tfrac12', bad2: '90 × 2', bad2e: 'Multiplicar por 2 sería el 200%.', bad4: '90 ÷ 4', bad4e: 'Dividir por 4 es el 25%.' },
      { p: 25, n: 80, op: '80 ÷ 4', f: '\\tfrac14', bad2: '80 × 4', bad2e: 'Multiplicar por 4 sería el 400%.', bad4: '80 ÷ 2', bad4e: 'Dividir por 2 es el 50%.' }
    ]);
    E.push(armar('Representar', '¿Cuál cálculo da el mismo resultado que el ' + G.p + '% de ' + G.n + '?',
      [{ t: G.op, err: null },
       { t: G.bad2, err: G.bad2e },
       { t: G.bad4, err: G.bad4e },
       { t: G.n + ' ÷ ' + G.p, err: 'Dividir por ' + G.p + ' no equivale al ' + G.p + '%.' }],
      'Correcto. ' + G.p + '% = \\(' + G.f + '\\), así que el ' + G.p + '% de ' + G.n + ' = ' + G.op + '.'));

    // P7 · razonamiento proporcional (Argumentar)
    var H = rnd([
      { p1: 10, v1: 45, p2: 20, v2: 90, num: 450 },
      { p1: 5, v1: 30, p2: 10, v2: 60, num: 600 }
    ]);
    E.push(armar('Argumentar', 'Si el ' + H.p1 + '% de un número es ' + H.v1 + ', ¿cuánto es el ' + H.p2 + '% de ese mismo número?',
      [{ t: '' + H.v2, err: null },
       { t: '' + H.v1, err: 'El ' + H.p2 + '% es el doble del ' + H.p1 + '%: ' + H.v1 + ' · 2 = ' + H.v2 + '.' },
       { t: '' + (H.v1 / 2), err: 'El ' + H.p2 + '% es MÁS que el ' + H.p1 + '%, no menos: ' + H.v2 + '.' },
       { t: '' + H.num, err: 'Ese es el número completo; su ' + H.p2 + '% es ' + H.v2 + '.' }],
      'Correcto. El ' + H.p2 + '% es el doble del ' + H.p1 + '%: ' + H.v1 + ' · 2 = ' + H.v2 + '. (El número es ' + H.num + '.)'));

    // P8 · identificar el error (Argumentar)
    E.push(armar('Argumentar', 'Para calcular el 20% de 150, una persona hace:\nPaso 1: escribe 20% = \\(\\tfrac{20}{100}\\).\nPaso 2: multiplica 150 × 20 = 3.000.\nPaso 3: concluye 3.000.\n¿Es correcto?',
      [{ t: 'No: falta dividir por 100 (3.000 ÷ 100 = 30).', err: null },
       { t: 'Sí, está correcto.', err: 'Falta dividir por 100: el 20% de 150 es 30, no 3.000.' },
       { t: 'No: debió sumar en vez de multiplicar.', err: 'Sí se multiplica, pero luego se divide por 100.' },
       { t: 'No: el resultado es 300.', err: 'Es 30: \\(\\tfrac{20\\cdot150}{100}=30\\).' }],
      'Correcto. Falta el paso final: \\(\\tfrac{20\\cdot150}{100}=30\\). Además, el resultado no puede superar al total (150).'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
</html>
