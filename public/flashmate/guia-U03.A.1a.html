<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U03.A.1a · Potencias</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U03.A.1a', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U03', unidadNum: '03', subunidad: 'A', nivel: 'a',
  titulo: 'Potencias',
  sub: 'Definición · signos · exponente cero',
  HAB_E: ['Representar', 'Argumentar', 'Resolver problemas', 'Argumentar', 'Resolver problemas', 'Representar', 'Resolver problemas', 'Argumentar'],
  generar: function () {
    var E = [];

    // P1 · definición (Representar)
    E.push(armar('Representar', '¿Qué significa la potencia \\(5^3\\)?',
      [{ t: '\\(5\\cdot5\\cdot5\\)', err: null },
       { t: '\\(5\\cdot3\\)', err: 'Eso es multiplicar base por exponente. La potencia es multiplicar la base por sí misma: \\(5\\cdot5\\cdot5\\).' },
       { t: '\\(3\\cdot3\\cdot3\\cdot3\\cdot3\\)', err: 'Cambiaste base y exponente. La base 5 se repite 3 veces: \\(5\\cdot5\\cdot5\\).' },
       { t: '\\(5+5+5\\)', err: 'La potencia es multiplicación reiterada, no suma: \\(5\\cdot5\\cdot5\\).' }],
      'Correcto. \\(5^3\\) es la base 5 multiplicada por sí misma 3 veces: \\(5\\cdot5\\cdot5=125\\).'));

    // P2 · signo exponente par (Argumentar)
    E.push(armar('Argumentar', 'Sin calcular, ¿el resultado de \\((-4)^2\\) es positivo o negativo?',
      [{ t: 'Positivo', err: null },
       { t: 'Negativo', err: 'El exponente es par: al multiplicar dos negativos el signo se hace positivo. \\((-4)^2=16\\).' },
       { t: 'Depende del signo de la base', err: 'Con exponente PAR el resultado es siempre positivo, sin importar el signo de la base.' },
       { t: 'Cero', err: 'La base no es cero: \\((-4)^2=16\\), positivo.' }],
      'Correcto. Todo número (positivo o negativo) elevado a un exponente PAR da resultado positivo: \\((-4)^2=16\\).'));

    // P3 · calcular potencia de base fraccionaria negativa (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\left(-\\tfrac{1}{3}\\right)^4\\).',
      [{ t: '\\(\\tfrac{1}{81}\\)', err: null },
       { t: '\\(-\\tfrac{1}{81}\\)', err: 'El exponente 4 es par: el resultado es positivo. \\(\\left(-\\tfrac13\\right)^4=\\tfrac{1}{81}\\).' },
       { t: '\\(\\tfrac{4}{12}\\)', err: 'No se multiplica base por exponente. Se eleva numerador y denominador: \\(\\tfrac{1^4}{3^4}=\\tfrac{1}{81}\\).' },
       { t: '\\(\\tfrac{1}{12}\\)', err: '\\(3^4=81\\), no \\(3\\cdot4=12\\). El resultado es \\(\\tfrac{1}{81}\\).' }],
      'Correcto. Exponente par ⇒ positivo, y \\(3^4=81\\): \\(\\left(-\\tfrac13\\right)^4=\\tfrac{1}{81}\\).'));

    // P4 · -x^n vs (-x)^n (Argumentar)
    E.push(armar('Argumentar', '¿Es cierto que \\(-3^2 = (-3)^2\\)?',
      [{ t: 'No: \\(-3^2=-9\\) y \\((-3)^2=9\\).', err: null },
       { t: 'Sí, ambas dan 9.', err: 'En \\(-3^2\\) el signo NO está dentro del cuadrado: \\(-3^2=-(3\\cdot3)=-9\\), distinto de \\((-3)^2=9\\).' },
       { t: 'Sí, ambas dan \\(-9\\).', err: 'En \\((-3)^2\\) el paréntesis eleva también el signo: \\((-3)^2=9\\). Son distintas.' },
       { t: 'No: ambas dan \\(-9\\).', err: 'Solo \\(-3^2=-9\\); con paréntesis \\((-3)^2=9\\).' }],
      'Correcto. \\(-3^2=-(3\\cdot3)=-9\\) (el signo queda afuera), mientras que \\((-3)^2=(-3)(-3)=9\\).'));

    // P5 · (x/y)^n (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\left(\\tfrac{2}{5}\\right)^3\\).',
      [{ t: '\\(\\tfrac{8}{125}\\)', err: null },
       { t: '\\(\\tfrac{8}{5}\\)', err: 'El exponente afecta a TODA la fracción, también al denominador: \\(\\tfrac{2^3}{5^3}=\\tfrac{8}{125}\\).' },
       { t: '\\(\\tfrac{6}{15}\\)', err: 'No se multiplica por 3; se eleva al cubo: \\(\\tfrac{2^3}{5^3}=\\tfrac{8}{125}\\).' },
       { t: '\\(\\tfrac{2}{125}\\)', err: 'También el numerador se eleva: \\(2^3=8\\). Queda \\(\\tfrac{8}{125}\\).' }],
      'Correcto. \\(\\left(\\tfrac{2}{5}\\right)^3=\\tfrac{2^3}{5^3}=\\tfrac{8}{125}\\) (el exponente afecta a numerador y denominador).'));

    // P6 · exponente cero (Representar)
    E.push(armar('Representar', '¿Cuánto vale \\((4+3)^0\\)?',
      [{ t: '\\(1\\)', err: null },
       { t: '\\(0\\)', err: 'Todo número distinto de cero elevado a 0 es 1, no 0. La base es \\(7\\neq0\\): resultado 1.' },
       { t: '\\(7\\)', err: 'El exponente 0 no deja la base igual: \\(7^0=1\\).' },
       { t: '\\(12\\)', err: 'No se multiplica \\(4\\cdot3\\); primero la base es \\(7\\), y \\(7^0=1\\).' }],
      'Correcto. La base es \\(4+3=7\\neq0\\), y todo número distinto de cero elevado a 0 vale 1.'));

    // P7 · signo exponente impar (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\((-2)^5\\).',
      [{ t: '\\(-32\\)', err: null },
       { t: '\\(32\\)', err: 'El exponente 5 es impar y la base es negativa: el resultado es negativo, \\(-32\\).' },
       { t: '\\(-10\\)', err: 'No es base por exponente: \\((-2)^5=-2\\cdot-2\\cdot-2\\cdot-2\\cdot-2=-32\\).' },
       { t: '\\(-25\\)', err: 'Revisa: \\(2^5=32\\), no 25. Con base negativa e impar: \\(-32\\).' }],
      'Correcto. Exponente IMPAR conserva el signo de la base: \\((-2)^5=-32\\).'));

    // P8 · no se suman potencias (Argumentar)
    E.push(armar('Argumentar', '¿Es cierto que \\(2^3+5^2 = 7^5\\)?',
      [{ t: 'No: hay que calcular cada una, da 33.', err: null },
       { t: 'Sí, se suman bases y exponentes.', err: 'No existe propiedad para sumar potencias. Se resuelve cada una: \\(8+25=33\\).' },
       { t: 'No: da \\(10^5\\).', err: 'No se suman bases ni exponentes. \\(2^3+5^2=8+25=33\\).' },
       { t: 'No: da \\(7^6\\).', err: 'No hay propiedad de suma de potencias: \\(8+25=33\\).' }],
      'Correcto. No hay propiedad para sumar potencias: se calcula cada una y se suma, \\(2^3+5^2=8+25=33\\).'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
</html>
