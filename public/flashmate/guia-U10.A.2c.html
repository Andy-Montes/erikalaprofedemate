<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U10.A.2c · Teorema de Pitágoras: casos especiales y aplicaciones</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U10.A.2c', eje: 'E3', ejeNombre: 'GEOMETRÍA', unidad: 'U10', unidadNum: '10', subunidad: 'A', nivel: 'c',
  titulo: 'Teorema de Pitágoras: casos especiales y aplicaciones',
  sub: '30-60-90 · altura a la hipotenusa · Euclides · multipaso PAES',
  HAB_E: ['Resolver problemas', 'Modelar', 'Argumentar', 'Resolver problemas', 'Representar', 'Representar', 'Resolver problemas', 'Modelar'],
  generar: function () {
    var E = [];

    // P1 · 30-60-90 suma de lados (Resolver) · FIGURA TRI
    var e1 = armar('Resolver problemas', 'El triángulo de la figura es rectángulo, con un ángulo de 60° y el cateto contiguo a ese ángulo mide 4. ¿Cuánto suman sus tres lados?',
      [{ t: '\\(12+4\\sqrt{3}\\)', err: null },
       { t: '\\(8+4\\sqrt{3}\\)', err: 'Dejaste fuera un lado. Los tres: cateto 4, cateto mayor \\(4\\sqrt{3}\\) e hipotenusa 8, es decir \\(12+4\\sqrt{3}\\).' },
       { t: '\\(16+2\\sqrt{3}\\)', err: 'Revisa el 30-60-90: el cateto mayor es \\(4\\sqrt{3}\\) y la hipotenusa 8, no \\(2\\sqrt{3}\\).' },
       { t: '\\(12+2\\sqrt{3}\\)', err: 'El cateto mayor es \\(4\\sqrt{3}\\), no \\(2\\sqrt{3}\\): frente al 60° va \\(\\tfrac{a\\sqrt{3}}{2}\\) con hipotenusa \\(a=8\\).' }],
      'Correcto. La hipotenusa es \\(a=8\\); frente al 30° va \\(\\tfrac{a}{2}=4\\) y frente al 60° va \\(\\tfrac{a\\sqrt{3}}{2}=4\\sqrt{3}\\). Suma \\(=4+4\\sqrt{3}+8=12+4\\sqrt{3}\\).');
    e1.fig = TRI({ base: 4, height: 7, baseL: { t: '4', role: 'dato' }, angB: { t: '60°', role: 'dato' }, desc: 'Triángulo rectángulo con un ángulo de 60° y cateto 4.' });
    E.push(e1);

    // P2 · rampa 30-60-90 (Modelar) · FIGURA TRI
    var e2 = armar('Modelar', 'Una rampa recta forma un ángulo de 30° con el suelo y mide 12 m de largo. ¿Qué altura \\(h\\) alcanza su extremo superior?',
      [{ t: '\\(6\\) m', err: null },
       { t: '\\(6\\sqrt{3}\\) m', err: 'Ese es el avance horizontal (frente al 60°). La altura va frente al 30°: \\(h=\\tfrac{12}{2}=6\\).' },
       { t: '\\(12\\sqrt{3}\\) m', err: 'La altura no puede superar el largo de la rampa. Frente al 30°: \\(h=\\tfrac{12}{2}=6\\).' },
       { t: '\\(4\\) m', err: 'El cateto menor es la mitad de la hipotenusa: \\(h=\\tfrac{12}{2}=6\\), no \\(\\tfrac{12}{3}\\).' }],
      'Correcto. La altura es el cateto opuesto al 30°, que es la mitad de la hipotenusa: \\(h=\\tfrac{12}{2}=6\\) m.');
    e2.fig = TRI({ base: 10, height: 6, hipL: { t: '12 m', role: 'dato' }, angB: { t: '30°', role: 'dato' }, vertL: { t: 'h', role: 'incog' }, desc: 'Rampa de 12 m que forma 30° con el suelo; altura h.' });
    E.push(e2);

    // P3 · identificar el error en 30-60-90 (Argumentar)
    E.push(armar('Argumentar', 'Diego calcula el cateto mayor \\(x\\) de un triángulo rectángulo de hipotenusa 10, con ángulos de 30° y 60°. Revisa su desarrollo:\nPaso 1: el cateto mayor está frente al ángulo de 60°.\nPaso 2: \\(x=\\dfrac{10}{2}=5\\)\nPaso 3: por lo tanto \\(x=5\\).\n¿Dónde está el error?',
      [{ t: 'En el Paso 2: al cateto mayor le corresponde \\(\\dfrac{10\\sqrt{3}}{2}\\), no \\(\\dfrac{10}{2}\\).', err: null },
       { t: 'En el Paso 1: el cateto mayor está frente al 30°.', err: 'No: el lado mayor se opone al ángulo mayor, así que el cateto mayor va frente al 60°. El error está en el valor del Paso 2.' },
       { t: 'No hay error, \\(x=5\\).', err: 'Sí hay error: \\(5\\) es el cateto menor (frente al 30°). El mayor es \\(\\tfrac{10\\sqrt{3}}{2}=5\\sqrt{3}\\).' },
       { t: 'En el Paso 3: faltó multiplicar por 2.', err: 'El error viene del Paso 2. El cateto mayor es \\(\\tfrac{10\\sqrt{3}}{2}=5\\sqrt{3}\\), no el doble de 5.' }],
      'Correcto. Frente al 60° va el cateto mayor \\(\\tfrac{a\\sqrt{3}}{2}=\\tfrac{10\\sqrt{3}}{2}=5\\sqrt{3}\\). Diego usó la fórmula del cateto menor \\(\\tfrac{a}{2}\\).');

    // P4 · isósceles: altura a la hipotenusa (Resolver) · FIGURA a mano
    var e4 = armar('Resolver problemas', 'El triángulo de la figura es rectángulo isósceles y su altura hacia la hipotenusa mide 5. ¿Cuánto mide la hipotenusa \\(x\\)?',
      [{ t: '\\(10\\)', err: null },
       { t: '\\(5\\)', err: 'La hipotenusa es mayor que su altura. En un rectángulo isósceles, la altura a la hipotenusa es su mitad: \\(x=2\\cdot5=10\\).' },
       { t: '\\(5\\sqrt{2}\\)', err: 'Eso sería un cateto. Aquí la altura cae sobre la hipotenusa y mide su mitad, así que \\(x=10\\).' },
       { t: '\\(20\\)', err: 'La altura es la mitad de la hipotenusa: \\(x=2\\cdot5=10\\), no \\(4\\cdot5\\).' }],
      'Correcto. En el triángulo rectángulo isósceles, la altura a la hipotenusa mide la mitad de ella (coincide con la transversal de gravedad). Entonces \\(x=2\\cdot5=10\\).');
    e4.fig = '<svg viewBox="0 0 220 152" width="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Triangulo isosceles rectangulo con altura"><title>Triángulo rectángulo isósceles</title><desc>Triángulo rectángulo isósceles ABC con altura 5 a la hipotenusa AB=x.</desc><polygon points="30,120 190,120 110,34" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><line x1="110" y1="34" x2="110" y2="120" stroke="#0187f3" stroke-width="1.6"/><path d="M110,34 L103.9,40.6 L110,47.1 L116.1,40.6 Z" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><polyline points="110,110 120,110 120,120" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><line x1="66" y1="74" x2="74" y2="80" stroke="#1a1a1a" stroke-width="1.4"/><line x1="146" y1="80" x2="154" y2="74" stroke="#1a1a1a" stroke-width="1.4"/><text x="96" y="80" font-family="sans-serif" font-size="13" font-weight="600" fill="#0187f3" text-anchor="end">5</text><text x="70" y="137" font-family="sans-serif" font-size="13" font-weight="600" fill="#ed3b62" text-anchor="middle">x</text><text x="24" y="133" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="end">A</text><text x="196" y="133" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="start">B</text><text x="110" y="28" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="middle">C</text></svg>';
    E.push(e4);

    // P5 · Teorema de Euclides (altura) (Representar) · FIGURA a mano
    var e5 = armar('Representar', 'La altura sobre la hipotenusa divide a esta en dos segmentos de 4 y 9 (figura). ¿Qué relación permite hallar la altura \\(h\\) y cuánto mide?',
      [{ t: '\\(h=\\sqrt{4\\cdot9}=6\\)', err: null },
       { t: '\\(h=4+9=13\\)', err: 'Eso es la hipotenusa completa, no la altura. Por Euclides, \\(h^2=m\\cdot n\\).' },
       { t: '\\(h=\\sqrt{4^2+9^2}=\\sqrt{97}\\)', err: 'Eso aplica Pitágoras entre 4 y 9, que no son catetos del mismo triángulo. La altura cumple \\(h^2=m\\cdot n=4\\cdot9\\).' },
       { t: '\\(h=\\dfrac{4+9}{2}=6{,}5\\)', err: 'No es el promedio, sino la media geométrica: \\(h=\\sqrt{m\\cdot n}=\\sqrt{36}=6\\).' }],
      'Correcto. Teorema de Euclides para la altura: \\(h^2=m\\cdot n=4\\cdot9=36\\Rightarrow h=6\\). La altura es la media geométrica de los dos segmentos.');
    e5.fig = '<svg viewBox="0 0 236 150" width="210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Teorema de Euclides"><title>Teorema de Euclides</title><desc>Triángulo rectángulo con altura h a la hipotenusa que la divide en 4 y 9.</desc><polygon points="30,122 210,122 85,39" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><line x1="85" y1="39" x2="85" y2="122" stroke="#ed3b62" stroke-width="1.7"/><path d="M85,39 L78.6,44.6 L85,52 L91.6,45.9 Z" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><polyline points="85,112 95,112 95,122" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><text x="57" y="138" font-family="sans-serif" font-size="13" font-weight="600" fill="#0187f3" text-anchor="middle">4</text><text x="148" y="138" font-family="sans-serif" font-size="13" font-weight="600" fill="#0187f3" text-anchor="middle">9</text><text x="95" y="84" font-family="sans-serif" font-size="13" font-weight="600" fill="#ed3b62" text-anchor="start">h</text><text x="24" y="135" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="end">A</text><text x="214" y="135" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="start">B</text><text x="85" y="33" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="middle">C</text><text x="85" y="135" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="middle">D</text></svg>';
    E.push(e5);

    // P6 · reconocer triángulo rectángulo con radical (Representar)
    E.push(armar('Representar', '¿Cuál de los siguientes triángulos es rectángulo, según la medida de sus lados?',
      [{ t: 'Lados \\(\\sqrt{7},\\ 3,\\ 4\\)', err: null },
       { t: 'Lados \\(2,\\ 3,\\ 4\\)', err: '\\(2^2+3^2=13\\neq4^2=16\\): no es rectángulo.' },
       { t: 'Lados \\(3,\\ 4,\\ 6\\)', err: '\\(3^2+4^2=25\\neq6^2=36\\): no cumple Pitágoras.' },
       { t: 'Lados \\(5,\\ 7,\\ 9\\)', err: '\\(5^2+7^2=74\\neq9^2=81\\): no es rectángulo.' }],
      'Correcto. \\((\\sqrt{7})^2+3^2=7+9=16=4^2\\): cumple el Teorema de Pitágoras, con hipotenusa 4.');

    // P7 · dos triángulos rectángulos, multipaso (Resolver) · FIGURA a mano
    var e7 = armar('Resolver problemas', 'En la figura, el triángulo \\(ACB\\) es recto en \\(A\\) y el triángulo \\(ABD\\) es recto en \\(D\\). Si \\(AC=15\\), \\(BC=17\\) y \\(BD=5\\), ¿cuánto mide \\(AD\\)?',
      [{ t: '\\(\\sqrt{39}\\)', err: null },
       { t: '\\(4\\)', err: 'Aplicaste Pitágoras una sola vez. Primero \\(AB=\\sqrt{17^2-15^2}=8\\); luego \\(AD=\\sqrt{8^2-5^2}=\\sqrt{39}\\).' },
       { t: '\\(5\\)', err: '\\(5\\) es \\(BD\\), no \\(AD\\). Con \\(AB=8\\): \\(AD=\\sqrt{8^2-5^2}=\\sqrt{39}\\).' },
       { t: '\\(\\sqrt{17}\\)', err: 'Revisa el primer paso: \\(AB=\\sqrt{289-225}=8\\), y luego \\(AD=\\sqrt{64-25}=\\sqrt{39}\\).' }],
      'Correcto. Paso 1: en \\(ACB\\), \\(AB=\\sqrt{17^2-15^2}=\\sqrt{64}=8\\). Paso 2: en \\(ABD\\), \\(AD=\\sqrt{AB^2-BD^2}=\\sqrt{64-25}=\\sqrt{39}\\).');
    e7.fig = '<svg viewBox="0 0 200 145" width="200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dos triangulos rectangulos"><title>Dos triángulos rectángulos</title><desc>Triángulo ACB recto en A (AC=15, BC=17) y triángulo ABD recto en D (BD=5, AD=x).</desc><polygon points="60,70 156,70 60,10" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><polygon points="60,70 156,70 118.5,117" fill="none" stroke="#1a1a1a" stroke-width="1.8"/><polyline points="60,58 72,58 72,70" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><path d="M118.5,117 L110.7,110.7 L116.9,102.9 L124.7,109.2 Z" fill="none" stroke="#1a1a1a" stroke-width="1.2"/><text x="52" y="42" font-family="sans-serif" font-size="13" font-weight="600" fill="#0187f3" text-anchor="end">15</text><text x="116" y="34" font-family="sans-serif" font-size="13" font-weight="600" fill="#0187f3" text-anchor="start">17</text><text x="146" y="92" font-family="sans-serif" font-size="13" font-weight="600" fill="#0187f3" text-anchor="start">5</text><text x="78" y="98" font-family="sans-serif" font-size="13" font-weight="600" fill="#ed3b62" text-anchor="end">x</text><text x="53" y="74" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="end">A</text><text x="160" y="72" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="start">B</text><text x="53" y="10" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="end">C</text><text x="120" y="132" font-family="sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#1a1a1a" text-anchor="middle">D</text></svg>';
    E.push(e7);

    // P8 · contexto de navegación (Modelar)
    E.push(armar('Modelar', 'Un barco navega 9 km al norte y luego 12 km al este. ¿A qué distancia en línea recta se encuentra de su punto de partida?',
      [{ t: '\\(15\\) km', err: null },
       { t: '\\(21\\) km', err: 'Sumaste los tramos (\\(9+12\\)). La distancia recta es la hipotenusa: \\(\\sqrt{9^2+12^2}\\).' },
       { t: '\\(\\sqrt{63}\\) km', err: 'Restaste (\\(144-81\\)). Los tramos son perpendiculares, así que se suman: \\(81+144=225\\).' },
       { t: '\\(225\\) km', err: '\\(9^2+12^2=225\\), pero falta la raíz: \\(\\sqrt{225}=15\\).' }],
      'Correcto. Los tramos norte y este son perpendiculares, así que la distancia es \\(\\sqrt{9^2+12^2}=\\sqrt{225}=15\\) km. Es el trío \\(3,4,5\\) por 3.');

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
</html>
