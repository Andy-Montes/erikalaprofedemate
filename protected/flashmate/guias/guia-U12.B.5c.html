<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U12.B.5c · Isometrías: reflexión, rotación y composición (PAES)</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U12.B.5c', eje: 'E3', ejeNombre: 'GEOMETRÍA', unidad: 'U12', unidadNum: '12', subunidad: 'B', nivel: 'c',
  titulo: 'Isometrías: reflexión, rotación y composición',
  sub: 'Elegir la imagen · composiciones · simetría axial y central · tipo PAES',
  HAB_E: ['Representar', 'Resolver problemas', 'Resolver problemas', 'Argumentar', 'Representar', 'Resolver problemas', 'Modelar', 'Argumentar'],
  generar: function () {
    var E = [];
    var L = [[1, 1], [1, 3], [3, 3], [3, 2], [2, 2], [2, 1]];
    function rY(p) { return [-p[0], p[1]]; } function rX(p) { return [p[0], -p[1]]; }
    function r180(p) { return [-p[0], -p[1]]; } function tr(p) { return [p[0] - 4, p[1]]; }
    function mapp(f) { return L.map(f); }

    // P1 · elegir la reflexión respecto del eje Y (Representar) · OPCIONES-FIGURA
    var e1 = armar('Representar', 'La figura (sólida) está en el primer cuadrante. ¿Cuál alternativa muestra su reflexión (punteada) respecto del eje Y?',
      [{ t: GRID({ xmin: -4, xmax: 4, ymin: -1, ymax: 4, unit: 13, polys: [{ pts: L, role: 'dato' }, { pts: mapp(rY), role: 'incog', dashed: true }], desc: 'Reflexión respecto al eje Y.' }), err: null },
       { t: GRID({ xmin: -4, xmax: 4, ymin: -4, ymax: 4, unit: 11, polys: [{ pts: L, role: 'dato' }, { pts: mapp(rX), role: 'incog', dashed: true }], desc: 'Reflexión respecto al eje X.' }), err: 'Esa es la reflexión respecto del eje X (la imagen queda abajo). Respecto del eje Y la imagen va al segundo cuadrante.' },
       { t: GRID({ xmin: -4, xmax: 4, ymin: -4, ymax: 4, unit: 11, polys: [{ pts: L, role: 'dato' }, { pts: mapp(r180), role: 'incog', dashed: true }], desc: 'Rotación de 180°.' }), err: 'Esa es una rotación de 180° (simetría central): la imagen queda en el tercer cuadrante, invertida.' },
       { t: GRID({ xmin: -6, xmax: 4, ymin: -1, ymax: 4, unit: 11, polys: [{ pts: L, role: 'dato' }, { pts: mapp(tr), role: 'incog', dashed: true }], desc: 'Traslación.' }), err: 'Esa es una traslación (se corrió a la izquierda sin voltearse). La reflexión produce una imagen espejada.' }],
      'Correcto. La reflexión respecto del eje Y cambia el signo de \\(x\\): la imagen es el espejo de la figura al otro lado del eje Y (segundo cuadrante).');
    e1.rawOpts = true;
    e1.fig = GRID({ xmin: -4, xmax: 4, ymin: -1, ymax: 4, unit: 16, polys: [{ pts: L, role: 'dato' }], desc: 'Figura original en el primer cuadrante.' });
    E.push(e1);

    // P2 · composición: reflexión eje X y luego eje Y (Resolver)
    E.push(armar('Resolver problemas', 'El punto \\(P(2,3)\\) se refleja respecto del eje X y luego respecto del eje Y. ¿Cuál es su imagen final?',
      [{ t: '\\((-2,-3)\\)', err: null },
       { t: '\\((2,-3)\\)', err: 'Esa es solo la primera reflexión (eje X). Falta reflejar respecto del eje Y.' },
       { t: '\\((-2,3)\\)', err: 'Esa es solo la reflexión respecto del eje Y (de \\(P\\) original).' },
       { t: '\\((3,2)\\)', err: 'No se intercambian las coordenadas: eje X da \\((2,-3)\\) y luego eje Y da \\((-2,-3)\\).' }],
      'Correcto. Eje X: \\((2,3)\\to(2,-3)\\); eje Y: \\((2,-3)\\to(-2,-3)\\). (Equivale a una rotación de 180°.)');

    // P3 · composición: rotación 90° y luego traslación (Resolver)
    E.push(armar('Resolver problemas', 'El punto \\((2,1)\\) se rota 90° antihorario (centro en el origen) y luego se traslada por \\((3,3)\\). ¿Cuál es su imagen final?',
      [{ t: '\\((2,5)\\)', err: null },
       { t: '\\((-1,5)\\)', err: 'La rotación da \\((-1,2)\\); al sumar \\((3,3)\\): \\((2,5)\\), no \\((-1,5)\\).' },
       { t: '\\((5,2)\\)', err: 'Cuida el orden: primero \\((x,y)\\to(-y,x)=(-1,2)\\); luego \\(+(3,3)=(2,5)\\).' },
       { t: '\\((2,-5)\\)', err: 'La rotación de 90° antihorario da \\((-1,2)\\) (segunda componente positiva).' }],
      'Correcto. Rotación 90°: \\((2,1)\\to(-1,2)\\); traslación: \\((-1+3,\\,2+3)=(2,5)\\).');

    // P4 · identificar el error: reflexión eje Y (Argumentar)
    E.push(armar('Argumentar', 'Para reflejar \\(P(-3,4)\\) respecto del eje Y, Sofía escribe \\(P\\,'=(-3,-4)\\). ¿Dónde está el error?',
      [{ t: 'La reflexión respecto del eje Y cambia el signo de \\(x\\): \\(P\\,'=(3,4)\\).', err: null },
       { t: 'No hay error; \\(P\\,'=(-3,-4)\\).', err: '\\((-3,-4)\\) es la reflexión respecto del eje X. Respecto del eje Y es \\((3,4)\\).' },
       { t: 'Debió cambiar el signo de ambas coordenadas.', err: 'Cambiar ambas es la simetría central. Respecto del eje Y cambia solo \\(x\\).' },
       { t: 'Debió intercambiar las coordenadas.', err: 'No se intercambian: respecto del eje Y, \\((a,b)\\to(-a,b)\\).' }],
      'Correcto. Respecto del eje Y cambia el signo de \\(x\\): \\((-3,4)\\to(3,4)\\). Sofía cambió \\(y\\) (eso es el eje X).');

    // P5 · invariantes en simetría axial (Representar)
    E.push(armar('Representar', 'En una simetría axial (reflexión respecto de una recta \\(L\\)), ¿qué puntos quedan invariantes (no se mueven)?',
      [{ t: 'Los puntos que pertenecen a la recta \\(L\\).', err: null },
       { t: 'Todos los puntos del plano.', err: 'Solo permanecen fijos los que están sobre \\(L\\); el resto se refleja al otro lado.' },
       { t: 'Ninguno.', err: 'Los puntos de la recta \\(L\\) sí quedan fijos (están sobre el "espejo").' },
       { t: 'Solo el origen.', err: 'Quedan fijos todos los puntos de \\(L\\), no solo el origen.' }],
      'Correcto. En una reflexión respecto de \\(L\\), los puntos de \\(L\\) permanecen invariantes; cada otro punto y su imagen equidistan de \\(L\\).');

    // P6 · hallar el vector de traslación de una figura (Resolver) · GRID
    var e6 = armar('Resolver problemas', 'La figura \\(F\\) se trasladó a \\(F\\,'\\) (figura). ¿Cuál es el vector de traslación aplicado?',
      [{ t: '\\((5,-3)\\)', err: null },
       { t: '\\((-5,3)\\)', err: 'Ese es el sentido contrario (de \\(F\\,'\\) a \\(F\\)). De \\(F\\) a \\(F\\,'\\): \\((5,-3)\\).' },
       { t: '\\((3,-5)\\)', err: 'Intercambiaste las componentes. Cada vértice se movió 5 a la derecha y 3 abajo: \\((5,-3)\\).' },
       { t: '\\((5,3)\\)', err: 'La figura bajó: la segunda componente es \\(-3\\).' }],
      'Correcto. Tomando un vértice: \\((-4,1)\\to(1,-2)\\), es decir \\((1-(-4),\\,-2-1)=(5,-3)\\).');
    e6.fig = GRID({ xmin: -6, xmax: 6, ymin: -4, ymax: 4, unit: 13, polys: [{ pts: [[-4, 1], [-2, 1], [-4, 3]], role: 'dato', t: 'F' }, { pts: [[1, -2], [3, -2], [1, 0]], role: 'incog', dashed: true, t: "F'" }], desc: 'Figura F trasladada a F prima.' });
    E.push(e6);

    // P7 · simetría central en contexto (Modelar)
    E.push(armar('Modelar', 'Una pieza está en la posición \\((5,-3)\\). Se dibuja su copia por simetría central respecto del origen. ¿En qué posición queda la copia?',
      [{ t: '\\((-5,3)\\)', err: null },
       { t: '\\((5,3)\\)', err: 'También cambia el signo de \\(x\\): la simetría central es \\((-x,-y)\\).' },
       { t: '\\((-5,-3)\\)', err: 'La segunda componente era \\(-3\\); su opuesto es \\(+3\\): \\((-5,3)\\).' },
       { t: '\\((3,-5)\\)', err: 'No se intercambian las coordenadas: \\((-x,-y)=(-5,3)\\).' }],
      'Correcto. Simetría central respecto del origen: \\((x,y)\\to(-x,-y)=(-5,3)\\).');

    // P8 · afirmación sobre la simetría axial (Argumentar)
    E.push(armar('Argumentar', '¿Cuál afirmación sobre una simetría axial (reflexión respecto de una recta) es correcta?',
      [{ t: 'Conserva el tamaño de la figura, pero invierte su sentido (efecto espejo).', err: null },
       { t: 'Agranda la figura al reflejarla.', err: 'Es una isometría: conserva el tamaño. No lo cambia.' },
       { t: 'Conserva el sentido de giro de la figura.', err: 'La reflexión invierte el sentido (como un espejo); la traslación y la rotación sí lo conservan.' },
       { t: 'Cambia la forma de la figura.', err: 'Conserva la forma (imagen congruente); solo la invierte respecto del eje.' }],
      'Correcto. La simetría axial es una isometría: conserva forma y tamaño, pero invierte el sentido (efecto espejo).');

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
</html>
