<!DOCTYPE html>

<title>Flash Mate · U03.B.7c · Raíces</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U03.B.7c', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U03', unidadNum: '03', subunidad: 'B', nivel: 'c',
  titulo: 'Raíces',
  sub: 'Raíz y potencia fraccionaria · simplificación · tipo PAES',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Resolver problemas', 'Representar', 'Resolver problemas', 'Representar', 'Argumentar', 'Resolver problemas'],
  generar: function () {
    var E = [];

    // P1 · raices como potencias (Resolver)
    E.push(armar('Resolver problemas', 'Si \\(p>0\\), reduce \\(\\left(\\sqrt[3]{p^6}\\right)^2\\cdot\\left(\\sqrt{p^7}\\right)^4\\).',
      [{ t: '\\(p^{18}\\)', err: null },
       { t: '\\(p^{56}\\)', err: 'Pasa a potencias: \\((p^{6/3})^2\\cdot(p^{7/2})^4=p^{4}\\cdot p^{14}=p^{18}\\) (se suman, no se multiplican todos).' },
       { t: '\\(p^{32}\\)', err: 'Revisa: \\((p^2)^2=p^4\\) y \\((p^{7/2})^4=p^{14}\\); \\(p^4\\cdot p^{14}=p^{18}\\).' },
       { t: '\\(p^{112}\\)', err: 'No se multiplican los dos exponentes finales: se SUMAN, \\(4+14=18\\).' }],
      'Correcto. \\(\\sqrt[3]{p^6}=p^2\\Rightarrow(p^2)^2=p^4\\); \\(\\sqrt{p^7}=p^{7/2}\\Rightarrow(p^{7/2})^4=p^{14}\\); \\(p^4\\cdot p^{14}=p^{18}\\).'));

    // P2 · raiz de raiz numerica (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\sqrt[3]{\\sqrt{64}}\\).',
      [{ t: '\\(2\\)', err: null },
       { t: '\\(\\sqrt[3]{16}\\)', err: 'Raíz de raíz: los índices se multiplican, \\(\\sqrt[3]{\\sqrt{64}}=\\sqrt[6]{64}=2\\).' },
       { t: '\\(\\sqrt[6]{2}\\)', err: 'El subradical es 64, no 2: \\(\\sqrt[6]{64}=2\\) porque \\(2^6=64\\).' },
       { t: '\\(\\sqrt[3]{4}\\)', err: '\\(\\sqrt{64}=8\\) y \\(\\sqrt[3]{8}=2\\); o directo \\(\\sqrt[6]{64}=2\\).' }],
      'Correcto. \\(\\sqrt[3]{\\sqrt{64}}=\\sqrt[6]{64}=2\\) (porque \\(2^6=64\\)).'));

    // P3 · combinacion con decimal periodico (Resolver)
    E.push(armar('Resolver problemas', 'Reduce \\(\\sqrt{0{,}\\overline{4}}\\cdot\\dfrac{x^{\\frac{2}{3}}}{\\sqrt[3]{x}}\\) (con \\(x>0\\)).',
      [{ t: '\\(\\tfrac{2}{3}\\cdot x^{\\frac{1}{3}}\\)', err: null },
       { t: '\\(0{,}2\\cdot x\\)', err: '\\(0{,}\\overline{4}=\\tfrac49\\) y \\(\\sqrt{\\tfrac49}=\\tfrac23\\); y \\(\\dfrac{x^{2/3}}{x^{1/3}}=x^{1/3}\\), no \\(x\\).' },
       { t: '\\(\\sqrt{\\tfrac{4}{10}}\\cdot x^{\\frac{1}{3}}\\)', err: '\\(0{,}\\overline{4}\\) es \\(\\tfrac49\\) (periódico), no \\(\\tfrac{4}{10}\\): \\(\\sqrt{\\tfrac49}=\\tfrac23\\).' },
       { t: '\\(0{,}\\overline{2}\\cdot x^{\\frac{1}{3}}\\)', err: '\\(\\sqrt{\\tfrac49}=\\tfrac23\\), que no es \\(0{,}\\overline2\\). El resultado es \\(\\tfrac23 x^{1/3}\\).' }],
      'Correcto. \\(0{,}\\overline{4}=\\tfrac49\\Rightarrow\\sqrt{\\tfrac49}=\\tfrac23\\); \\(\\dfrac{x^{2/3}}{x^{1/3}}=x^{2/3-1/3}=x^{1/3}\\); da \\(\\tfrac23 x^{\\frac13}\\).'));

    // P4 · producto raices distinto indice a potencia (Representar)
    E.push(armar('Representar', 'Expresa \\(\\sqrt[3]{2}\\cdot\\sqrt[4]{2}\\) como una sola potencia o raíz.',
      [{ t: '\\(\\sqrt[12]{2^7}\\)', err: null },
       { t: '\\(\\sqrt[7]{2}\\)', err: 'Se suman los exponentes fraccionarios: \\(\\tfrac13+\\tfrac14=\\tfrac{7}{12}\\), da \\(2^{7/12}=\\sqrt[12]{2^7}\\).' },
       { t: '\\(\\sqrt[12]{2}\\)', err: 'El numerador del exponente es 7: \\(2^{7/12}=\\sqrt[12]{2^7}\\), no \\(\\sqrt[12]{2}\\).' },
       { t: '\\(\\sqrt[7]{2^{12}}\\)', err: 'El índice es el denominador (12) y el exponente el numerador (7): \\(\\sqrt[12]{2^7}\\).' }],
      'Correcto. \\(\\sqrt[3]{2}\\cdot\\sqrt[4]{2}=2^{\\frac13}\\cdot2^{\\frac14}=2^{\\frac13+\\frac14}=2^{\\frac{7}{12}}=\\sqrt[12]{2^7}\\).'));

    // P5 · raiz de raiz numerica exacta (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(\\sqrt{\\sqrt[3]{729}}\\).',
      [{ t: '\\(3\\)', err: null },
       { t: '\\(9\\)', err: '\\(\\sqrt[3]{729}=9\\), pero falta la raíz cuadrada externa: \\(\\sqrt{9}=3\\).' },
       { t: '\\(\\sqrt[6]{729}\\)', err: 'Correcto el paso intermedio, pero tiene valor exacto: \\(\\sqrt[6]{729}=3\\) porque \\(3^6=729\\).' },
       { t: '\\(27\\)', err: 'Revisa: \\(\\sqrt[3]{729}=9\\) y \\(\\sqrt9=3\\); o directo \\(\\sqrt[6]{729}=3\\).' }],
      'Correcto. \\(\\sqrt{\\sqrt[3]{729}}=\\sqrt[6]{729}=3\\) (porque \\(3^6=729\\)).'));

    // P6 · raiz como potencia con exponente (Representar)
    E.push(armar('Representar', 'Escribe \\(\\sqrt[5]{a^3}\\) como potencia de exponente fraccionario (con \\(a>0\\)).',
      [{ t: '\\(a^{\\frac{3}{5}}\\)', err: null },
       { t: '\\(a^{\\frac{5}{3}}\\)', err: 'El índice (5) es el denominador y el exponente del subradical (3) el numerador: \\(a^{\\frac{3}{5}}\\).' },
       { t: '\\(a^{\\frac{1}{5}}\\)', err: 'El exponente 3 del subradical va en el numerador: \\(a^{\\frac{3}{5}}\\).' },
       { t: '\\(3^{\\frac{1}{5}}\\)', err: 'La base es \\(a\\), no 3: \\(\\sqrt[5]{a^3}=a^{\\frac{3}{5}}\\).' }],
      'Correcto. \\(\\sqrt[x]{a^y}=a^{\\frac{y}{x}}\\): \\(\\sqrt[5]{a^3}=a^{\\frac{3}{5}}\\).'));

    // P7 · existencia (Argumentar)
    E.push(armar('Argumentar', 'En los números reales, ¿tiene solución \\(\\sqrt[4]{-16}\\)?',
      [{ t: 'No: índice par y subradical negativo.', err: null },
       { t: 'Sí: es \\(-2\\).', err: '\\((-2)^4=16\\) (positivo), no \\(-16\\). Con índice par no hay raíz real de un negativo.' },
       { t: 'Sí: es \\(2\\).', err: '\\(2^4=16\\), no \\(-16\\). No existe raíz real.' },
       { t: 'Sí: es \\(\\pm2\\).', err: 'Ningún real elevado a la 4 da negativo: no existe en los reales.' }],
      'Correcto. \\(\\sqrt[4]{-16}\\) no existe en los reales: índice PAR exige subradical \\(\\geq0\\), y \\(-16<0\\).'));

    // P8 · potencia fraccionaria a raiz y simplificar (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(2^{\\frac{5}{2}}\\).',
      [{ t: '\\(4\\sqrt{2}\\)', err: null },
       { t: '\\(2\\sqrt{2}\\)', err: '\\(2^{5/2}=\\sqrt{2^5}=\\sqrt{32}=\\sqrt{16\\cdot2}=4\\sqrt2\\) (no \\(2\\sqrt2\\)).' },
       { t: '\\(\\sqrt{10}\\)', err: 'No se multiplica base por exponente: \\(2^{5/2}=\\sqrt{2^5}=\\sqrt{32}=4\\sqrt2\\).' },
       { t: '\\(32\\)', err: 'Ese sería \\(2^5\\); pero el exponente es \\(\\tfrac52\\): \\(\\sqrt{2^5}=\\sqrt{32}=4\\sqrt2\\).' }],
      'Correcto. \\(2^{\\frac{5}{2}}=\\sqrt{2^5}=\\sqrt{32}=\\sqrt{16\\cdot2}=4\\sqrt{2}\\).'));

    return E;
  }
};
</script>
