<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U03.A.3c · Potencias</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U03.A.3c', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U03', unidadNum: '03', subunidad: 'A', nivel: 'c',
  titulo: 'Potencias',
  sub: 'Operatoria combinada · base 10 · notación científica',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Modelar', 'Resolver problemas', 'Argumentar', 'Argumentar', 'Resolver problemas', 'Representar'],
  generar: function () {
    var E = [];

    // P1 · operatoria combinada con signos (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(-3\\cdot(-2)^2+(-3)^3:9\\).',
      [{ t: '\\(-15\\)', err: null },
       { t: '\\(-9\\)', err: 'Resuelve por partes: \\(-3\\cdot4=-12\\) y \\((-3)^3:9=-27:9=-3\\); suma \\(-15\\).' },
       { t: '\\(1\\)', err: 'Cuidado con los signos: \\(-3\\cdot(-2)^2=-12\\) (no \\(+12\\)). Total \\(-15\\).' },
       { t: '\\(9\\)', err: '\\((-2)^2=4\\) (positivo) y va multiplicado por \\(-3\\): \\(-12\\); con \\(-3\\) da \\(-15\\).' }],
      'Correcto. \\((-2)^2=4\\Rightarrow-3\\cdot4=-12\\); \\((-3)^3=-27\\Rightarrow-27:9=-3\\); total \\(-12+(-3)=-15\\).'));

    // P2 · exponente negativo (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\(2^{-4}\\).',
      [{ t: '\\(\\tfrac{1}{16}\\)', err: null },
       { t: '\\(-8\\)', err: 'El exponente negativo no multiplica ni da negativo: invierte la base. \\(2^{-4}=\\tfrac{1}{2^4}=\\tfrac{1}{16}\\).' },
       { t: '\\(-\\tfrac{1}{16}\\)', err: 'El resultado es positivo: el signo del exponente solo indica inverso. \\(\\tfrac{1}{16}\\).' },
       { t: '\\(\\tfrac{1}{8}\\)', err: '\\(2^4=16\\), no \\(2\\cdot4=8\\): \\(2^{-4}=\\tfrac{1}{16}\\).' }],
      'Correcto. \\(2^{-4}=\\tfrac{1}{2^4}=\\tfrac{1}{16}\\).'));

    // P3 · notacion cientifica, hallar exponente (Modelar)
    E.push(armar('Modelar', 'El grosor de una hoja es \\(0{,}0000034\\) m. Si se escribe como \\(3{,}4\\cdot10^{p}\\), ¿cuánto vale \\(p\\)?',
      [{ t: '\\(-6\\)', err: null },
       { t: '\\(-7\\)', err: 'Cuenta los lugares: la coma se corre 6 posiciones para llegar a \\(3{,}4\\): \\(p=-6\\).' },
       { t: '\\(6\\)', err: 'El número es menor que 1, así que el exponente es NEGATIVO: \\(p=-6\\).' },
       { t: '\\(-5\\)', err: 'Revisa el conteo de decimales: \\(0{,}0000034=3{,}4\\cdot10^{-6}\\).' }],
      'Correcto. \\(0{,}0000034=3{,}4\\cdot10^{-6}\\): al ser menor que 1, el exponente es negativo y hay 6 lugares.'));

    // P4 · division igual exponente con decimales (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\((0{,}4)^6:(0{,}2)^6\\).',
      [{ t: '\\(2^6\\)', err: null },
       { t: '\\(2^0\\)', err: 'Igual exponente: se dividen las bases y se mantiene el exponente. \\((0{,}4:0{,}2)^6=2^6\\).' },
       { t: '\\((0{,}2)^6\\)', err: '\\(0{,}4:0{,}2=2\\), no \\(0{,}2\\): queda \\(2^6\\).' },
       { t: '\\((0{,}02)^6\\)', err: 'La división de las bases es \\(0{,}4:0{,}2=2\\): \\(2^6\\).' }],
      'Correcto. Igual exponente: \\((0{,}4)^6:(0{,}2)^6=(0{,}4:0{,}2)^6=2^6\\).'));

    // P5 · (1)^n + (1)^2n (Argumentar)
    E.push(armar('Argumentar', 'Si \\(n\\) es un entero positivo, ¿cuánto vale \\((1)^n+(1)^{2n}\\)?',
      [{ t: '\\(2\\) siempre', err: null },
       { t: 'Depende del valor de \\(n\\)', err: 'La base es 1: \\(1\\) elevado a cualquier exponente es 1. Así \\(1+1=2\\) para todo \\(n\\).' },
       { t: '\\(0\\)', err: '\\(1^n=1\\) y \\(1^{2n}=1\\): la suma es \\(2\\), no 0.' },
       { t: '\\(-2\\)', err: 'La base 1 nunca da negativos: \\(1+1=2\\).' }],
      'Correcto. \\(1\\) elevado a cualquier exponente es \\(1\\): \\(1^n+1^{2n}=1+1=2\\), sin importar \\(n\\).'));

    // P6 · (-1)^n + (-1)^2n (Argumentar)
    E.push(armar('Argumentar', 'Si \\(n\\) es un entero positivo, ¿cuánto vale \\((-1)^n+(-1)^{2n}\\)?',
      [{ t: 'Depende del valor de \\(n\\)', err: null },
       { t: '\\(2\\) siempre', err: 'Solo si \\(n\\) es par. Si \\(n\\) es impar: \\((-1)^n=-1\\) y \\((-1)^{2n}=1\\), da 0.' },
       { t: '\\(0\\) siempre', err: 'Solo si \\(n\\) es impar. Si \\(n\\) es par: \\((-1)^n=1\\) y da 2. Por eso depende.' },
       { t: '\\(-2\\) siempre', err: '\\((-1)^{2n}\\) siempre es 1 (exponente par), así que nunca da \\(-2\\).' }],
      'Correcto. \\((-1)^{2n}=1\\) siempre; pero \\((-1)^n\\) es \\(1\\) si \\(n\\) es par y \\(-1\\) si es impar: la suma es 2 o 0. Depende de \\(n\\).'));

    // P7 · resta con signos (Resolver)
    E.push(armar('Resolver problemas', 'Calcula \\((-3)^2-(-3)^3\\).',
      [{ t: '\\(36\\)', err: null },
       { t: '\\(-18\\)', err: '\\((-3)^3=-27\\); restar un negativo suma: \\(9-(-27)=9+27=36\\).' },
       { t: '\\(18\\)', err: '\\((-3)^2=9\\) y \\((-3)^3=-27\\): \\(9-(-27)=36\\).' },
       { t: '\\(-36\\)', err: 'El resultado es positivo: \\(9+27=36\\).' }],
      'Correcto. \\((-3)^2=9\\), \\((-3)^3=-27\\); \\(9-(-27)=9+27=36\\).'));

    // P8 · escribir numero pequeno como potencia de 10 (Representar)
    E.push(armar('Representar', 'Escribe \\(0{,}0002\\) como un número por una potencia de 10:',
      [{ t: '\\(2\\cdot10^{-4}\\)', err: null },
       { t: '\\(2\\cdot10^{4}\\)', err: 'El número es menor que 1: el exponente es NEGATIVO. \\(0{,}0002=2\\cdot10^{-4}\\).' },
       { t: '\\(2\\cdot10^{-3}\\)', err: 'Cuenta los decimales: \\(0{,}0002=2\\cdot0{,}0001=2\\cdot10^{-4}\\).' },
       { t: '\\(20\\cdot10^{-4}\\)', err: '\\(20\\cdot10^{-4}=0{,}002\\), diez veces mayor. Lo correcto es \\(2\\cdot10^{-4}\\).' }],
      'Correcto. \\(0{,}0002=2\\cdot0{,}0001=2\\cdot10^{-4}\\) (menor que 1 ⇒ exponente negativo).'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
