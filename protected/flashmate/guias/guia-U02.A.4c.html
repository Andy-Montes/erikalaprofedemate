<title>Flash Mate · U02.A.4c · Porcentajes</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U02.A.4c', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U02', unidadNum: '02', subunidad: 'A', nivel: 'c',
  titulo: 'Porcentajes',
  sub: 'Aplicaciones · Descuentos y comercio',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Modelar', 'Modelar', 'Representar', 'Representar', 'Argumentar', 'Argumentar'],
  generar: function () {
    var E = [];

    // P1 · descuento, precio final (Resolver) · FIGURA DE ENUNCIADO (ETQ) — leer el dato de la etiqueta
    var e1 = armar('Resolver problemas', 'Observa la etiqueta de los audífonos. ¿Cuánto se paga finalmente al aplicar el descuento?',
      [{ t: '$9.000', err: null },
       { t: '$3.000', err: 'Ese es el descuento; el precio final es 12.000 − 3.000 = $9.000.' },
       { t: '$11.975', err: 'El 25% de 12.000 es 3.000 (no 25). Precio final: $9.000.' },
       { t: '$15.000', err: 'El descuento RESTA, no suma: $9.000.' }],
      'Correcto. 25% de 12.000 = $3.000; precio final = 12.000 − 3.000 = $9.000. (O directo: 12.000 · 0,75.)');
    e1.fig = ETQ({ producto: 'Audífonos', precio: '$12.000', desc: '25%', total: '?', alt: 'Etiqueta: precio 12.000, descuento 25%, total a pagar desconocido.' });
    E.push(e1);

    // P2 · aumento con IVA (Resolver)
    E.push(armar('Resolver problemas', 'Un producto cuesta $20.000 más un 19% de IVA. ¿Cuál es el precio con IVA?',
      [{ t: '$23.800', err: null },
       { t: '$3.800', err: 'Ese es solo el IVA; el precio final lo SUMA: 20.000 + 3.800 = $23.800.' },
       { t: '$20.019', err: 'El 19% de 20.000 es 3.800 (no 19). Precio con IVA: $23.800.' },
       { t: '$16.200', err: 'El IVA se suma, no se resta: $23.800.' }],
      'Correcto. 19% de 20.000 = $3.800; precio con IVA = 20.000 + 3.800 = $23.800. (O directo: 20.000 · 1,19.)'));

    // P3 · cuánto se paga (Modelar)
    E.push(armar('Modelar', 'Unas zapatillas cuestan $40.000 y tienen un 30% de descuento. ¿Cuánto se paga?',
      [{ t: '$28.000', err: null },
       { t: '$12.000', err: 'Ese es el descuento; se paga 40.000 − 12.000 = $28.000.' },
       { t: '$39.970', err: 'El 30% de 40.000 es 12.000. Se paga $28.000.' },
       { t: '$37.000', err: 'Revisa: 30% de 40.000 = 12.000; se paga $28.000.' }],
      'Correcto. 30% de 40.000 = $12.000; se paga 40.000 − 12.000 = $28.000. (O 40.000 · 0,7.)'));

    // P4 · cuánto se ahorra (Modelar)
    E.push(armar('Modelar', 'Una chaqueta de $50.000 tiene un 40% de descuento. ¿Cuánto se AHORRA con el descuento?',
      [{ t: '$20.000', err: null },
       { t: '$30.000', err: 'Eso es lo que se PAGA; lo que se ahorra es el descuento: $20.000.' },
       { t: '$40.000', err: 'El 40% de 50.000 es 20.000, no 40.000.' },
       { t: '$10.000', err: 'Revisa: 40% de 50.000 = $20.000.' }],
      'Correcto. Se ahorra el descuento: 40% de 50.000 = $20.000 (y se paga $30.000).'));

    // P5 · factor de descuento (Representar)
    E.push(armar('Representar', 'Aplicar un 25% de descuento a un precio equivale a multiplicarlo por:',
      [{ t: '0,75', err: null },
       { t: '0,25', err: 'Multiplicar por 0,25 da el descuento, no el precio final. Se paga el 75%: 0,75.' },
       { t: '1,25', err: 'Eso es un AUMENTO del 25%. Un descuento multiplica por menos de 1.' },
       { t: '0,5', err: 'Se paga el 100% − 25% = 75%, o sea 0,75.' }],
      'Correcto. Con 25% de descuento se paga el 75%: multiplicar por 0,75.'));

    // P6 · relacionar pago y descuento (Representar)
    E.push(armar('Representar', 'Si en una tienda finalmente se paga el 80% del precio, ¿de qué porcentaje fue el descuento?',
      [{ t: '20%', err: null },
       { t: '80%', err: '80% es lo que se PAGA; el descuento es lo que falta para 100%: 20%.' },
       { t: '100%', err: 'Si el descuento fuera 100%, se pagaría $0. Aquí se paga el 80%.' },
       { t: '120%', err: 'El descuento no puede superar el 100%. Es 100% − 80% = 20%.' }],
      'Correcto. Pagar el 80% significa un descuento del 100% − 80% = 20%.'));

    // P7 · descuentos sucesivos (Argumentar)
    E.push(armar('Argumentar', 'Una tienda aplica un 10% de descuento y, sobre ese nuevo precio, otro 10%. ¿Equivale a un 20% de descuento total?',
      [{ t: 'No: equivale a un 19% total.', err: null },
       { t: 'Sí, exactamente 20%.', err: 'Los descuentos sucesivos no se suman: 0,9 · 0,9 = 0,81, o sea se paga el 81% (19% de descuento).' },
       { t: 'No: equivale a un 21%.', err: '0,9 · 0,9 = 0,81 → se paga el 81%, o sea 19% de descuento.' },
       { t: 'No se puede saber.', err: 'Sí se puede: 0,9 · 0,9 = 0,81 → 19% de descuento total.' }],
      'Correcto. 0,9 · 0,9 = 0,81: se paga el 81%, es decir un 19% de descuento total, no 20%.'));

    // P8 · sube y baja el mismo % (Argumentar)
    E.push(armar('Argumentar', 'Un artículo primero SUBE un 20% y luego BAJA un 20%. ¿Queda en el mismo precio inicial?',
      [{ t: 'No: queda en el 96% del precio inicial.', err: null },
       { t: 'Sí, queda igual.', err: 'El segundo 20% se calcula sobre un precio mayor: 1,2 · 0,8 = 0,96, no 1.' },
       { t: 'Queda en el 104%.', err: 'Queda MENOR: 1,2 · 0,8 = 0,96 → 96%.' },
       { t: 'Queda en el 100%.', err: '1,2 · 0,8 = 0,96, o sea el 96% del inicial.' }],
      'Correcto. 1,2 · 0,8 = 0,96: el artículo queda en el 96% del precio inicial, un poco más barato.'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
</html>
