<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U02.A.6c', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U02', unidadNum: '02', subunidad: 'A', nivel: 'c',
  titulo: 'Porcentajes',
  sub: 'Mixto tipo PAES · Variación y dos etapas',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Modelar', 'Modelar', 'Representar', 'Representar', 'Argumentar', 'Argumentar'],
  generar: function () {
    var E = [];

    // P1 · dos etapas sube-baja (Resolver)
    E.push(armar('Resolver problemas', 'Un precio de $10.000 sube un 20% y luego baja un 10% sobre el nuevo valor. ¿Cuál es el precio final?',
      [{ t: '$10.800', err: null },
       { t: '$11.000', err: 'Falta la segunda etapa: sube a 12.000 y luego baja 10% (1.200): $10.800.' },
       { t: '$10.000', err: 'No queda igual: 10.000 · 1,2 · 0,9 = $10.800.' },
       { t: '$12.000', err: 'Ese es solo tras la subida; falta la baja del 10%: $10.800.' }],
      'Correcto. 10.000 · 1,2 = 12.000; 12.000 · 0,9 = $10.800.'));

    // P2 · complemento (Resolver)
    E.push(armar('Resolver problemas', 'En un curso, el 40% son hombres. Si hay 18 mujeres, ¿cuántos estudiantes tiene el curso?',
      [{ t: '30', err: null },
       { t: '45', err: 'Las mujeres son el 60%, no el 40%: 18 es el 60%, y el total es 30.' },
       { t: '25,2', err: '18 no es el 40%; las mujeres son el 60% (100% − 40%).' },
       { t: '42', err: 'Revisa: si 18 es el 60%, el 100% es 30.' }],
      'Correcto. Las mujeres son el 60% (100% − 40%). Si el 60% son 18, el 100% es \\(\\tfrac{100\\cdot18}{60}=30\\).'));

    // P3 · sube y baja distinto (Modelar)
    E.push(armar('Modelar', 'Una acción sube un 25% un día y baja un 20% al día siguiente. Respecto al valor inicial, ¿cómo queda?',
      [{ t: 'Queda igual que al inicio.', err: null },
       { t: 'Sube un 5%.', err: '1,25 · 0,8 = 1: queda exactamente igual, no sube.' },
       { t: 'Baja un 5%.', err: '1,25 · 0,8 = 1: queda igual, no baja.' },
       { t: 'Sube un 45%.', err: 'No se suman los porcentajes: 1,25 · 0,8 = 1.' }],
      'Correcto. 1,25 · 0,8 = 1: la acción vuelve exactamente a su valor inicial.'));

    // P4 · dos etapas de pérdida (Modelar)
    E.push(armar('Modelar', 'Un estanque con 5.000 L pierde un 10% y luego pierde un 10% de lo que quedaba. ¿Cuánta agua queda?',
      [{ t: '4.050 L', err: null },
       { t: '4.000 L', err: 'El segundo 10% se calcula sobre 4.500 (no sobre 5.000): 5.000 · 0,9 · 0,9 = 4.050.' },
       { t: '4.100 L', err: 'Revisa: 5.000 · 0,9 = 4.500; 4.500 · 0,9 = 4.050.' },
       { t: '4.500 L', err: 'Esa es solo la primera pérdida; falta la segunda: 4.050 L.' }],
      'Correcto. 5.000 · 0,9 = 4.500; 4.500 · 0,9 = 4.050 L.'));

    // P5 · aumento del 100% (Representar)
    E.push(armar('Representar', 'Aumentar una cantidad en un 100% equivale a multiplicarla por:',
      [{ t: '2', err: null },
       { t: '1', err: 'Multiplicar por 1 la deja igual. Aumentar 100% es 1 + 1 = 2 (el doble).' },
       { t: '100', err: 'El 100% = 1; el factor de aumento es 1 + 1 = 2.' },
       { t: '0,5', err: 'Eso sería una disminución del 50%. Aumentar 100% es multiplicar por 2.' }],
      'Correcto. Aumentar 100% = multiplicar por 1 + 1 = 2 (el doble de la cantidad).'));

    // P6 · decimal a porcentaje (Representar)
    E.push(armar('Representar', 'Si una parte corresponde a 0,2 del total, ¿qué porcentaje representa?',
      [{ t: '20%', err: null },
       { t: '2%', err: '0,2 = \\(\\tfrac{20}{100}\\) = 20%, no 2%. Se multiplica por 100.' },
       { t: '0,2%', err: 'Para pasar de decimal a % se multiplica por 100: 0,2 = 20%.' },
       { t: '200%', err: '0,2 es menor que 1, así que es menos del 100%: 20%.' }],
      'Correcto. 0,2 = \\(\\tfrac{20}{100}\\) = 20% (decimal a porcentaje: × 100).'));

    // P7 · comparar variación porcentual (Argumentar)
    E.push(armar('Argumentar', 'El precio A subió de $100 a $150; el precio B subió de $200 a $260. ¿Cuál tuvo MAYOR aumento PORCENTUAL?',
      [{ t: 'A, con un 50%.', err: null },
       { t: 'B, porque subió más pesos.', err: 'B subió $60 pero solo un 30%; A subió un 50%. El % compara respecto al inicial.' },
       { t: 'Los dos igual.', err: 'A subió 50% y B subió 30%: no son iguales.' },
       { t: 'B, con un 30%.', err: 'B sí subió 30%, pero A subió 50%, que es mayor.' }],
      'Correcto. A: \\(\\tfrac{50}{100}=50\\%\\); B: \\(\\tfrac{60}{200}=30\\%\\). Aunque B subió más pesos, A tuvo mayor aumento porcentual.'));

    // P8 · descuentos que "suman" (Argumentar)
    E.push(armar('Argumentar', 'Un cartel dice: "50% + 50% de descuento = 100% gratis". ¿Es cierto?',
      [{ t: 'No: se termina pagando el 25% del precio.', err: null },
       { t: 'Sí, sale gratis.', err: 'Los descuentos sucesivos no se suman: 0,5 · 0,5 = 0,25, se paga el 25%.' },
       { t: 'Se paga el 50%.', err: 'Se aplica 50% dos veces sobre valores distintos: 0,5 · 0,5 = 0,25.' },
       { t: 'Se paga el 0%.', err: 'No es gratis: 0,5 · 0,5 = 0,25 → se paga el 25%.' }],
      'Correcto. 0,5 · 0,5 = 0,25: tras los dos descuentos se paga el 25% del precio, no sale gratis.'));

    return E;
  }
};
</script>
