<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U02.A.3b · Porcentajes</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U02.A.3b', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U02', unidadNum: '02', subunidad: 'A', nivel: 'b',
  titulo: 'Porcentajes',
  sub: 'Casos 2 y 3 · Qué % es a de b · De qué número',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Representar', 'Modelar', 'Modelar', 'Representar', 'Argumentar', 'Argumentar'],
  generar: function () {
    var E = [];

    // P1 · Caso 2 (Resolver)
    var A = rnd([
      { a: 40, b: 200, r: '20%', d1: '200%', d2: '160%', d3: '5%' },
      { a: 30, b: 120, r: '25%', d1: '250%', d2: '90%', d3: '4%' }
    ]);
    E.push(armar('Resolver problemas', '¿Qué porcentaje es ' + A.a + ' de ' + A.b + '?',
      [{ t: A.r, err: null },
       { t: A.d1, err: 'Es \\(\\tfrac{100\\cdot' + A.a + '}{' + A.b + '}=' + A.r + '\\), no ' + A.d1 + '.' },
       { t: A.d2, err: A.a + ' es una parte de ' + A.b + ', el porcentaje es ' + A.r + '.' },
       { t: A.d3, err: 'Revisa: \\(\\tfrac{100\\cdot' + A.a + '}{' + A.b + '}=' + A.r + '\\).' }],
      'Correcto. Qué % es a de b = \\(\\tfrac{100\\cdot a}{b}=\\tfrac{100\\cdot' + A.a + '}{' + A.b + '}=' + A.r + '\\).'));

    // P2 · Caso 3 (Resolver)
    var B = rnd([
      { a: 40, p: 50, r: '80', d1: '20', d2: '2.000', d3: '90' },
      { a: 10, p: 20, r: '50', d1: '2', d2: '200', d3: '30' }
    ]);
    E.push(armar('Resolver problemas', '¿De qué número ' + B.a + ' es el ' + B.p + '%?',
      [{ t: B.r, err: null },
       { t: B.d1, err: B.a + ' es el ' + B.p + '%; el número completo es mayor: ' + B.r + '.' },
       { t: B.d2, err: 'No se multiplica sin más; es \\(\\tfrac{100\\cdot' + B.a + '}{' + B.p + '}=' + B.r + '\\).' },
       { t: B.d3, err: 'Revisa: \\(\\tfrac{100\\cdot' + B.a + '}{' + B.p + '}=' + B.r + '\\).' }],
      'Correcto. El número es \\(\\tfrac{100\\cdot a}{b}=\\tfrac{100\\cdot' + B.a + '}{' + B.p + '}=' + B.r + '\\).'));

    // P3 · reconocer la operación (Representar)
    E.push(armar('Representar', 'Para calcular QUÉ PORCENTAJE es \\(a\\) de \\(b\\), ¿qué operación se usa?',
      [{ t: '\\(\\tfrac{100\\cdot a}{b}\\)', err: null },
       { t: '\\(\\tfrac{a\\cdot b}{100}\\)', err: 'Esa fórmula calcula el a% de b (Caso 1), no qué porcentaje es.' },
       { t: '\\(\\tfrac{100\\cdot b}{a}\\)', err: 'Invierte a y b: la parte va arriba, el total abajo.' },
       { t: '\\(\\tfrac{a}{b}\\)', err: 'Eso da el decimal; falta multiplicar por 100 para el porcentaje.' }],
      'Correcto. Qué % es \\(a\\) de \\(b\\) = \\(\\tfrac{100\\cdot a}{b}\\) (parte sobre total, por 100).'));

    // P4 · Caso 2 contexto (Modelar)
    E.push(armar('Modelar', 'En una prueba de 50 puntos, Ana obtuvo 30. ¿Qué porcentaje de logro alcanzó?',
      [{ t: '60%', err: null },
       { t: '30%', err: '30 de 50 = \\(\\tfrac{100\\cdot30}{50}=60\\%\\).' },
       { t: '166%', err: 'Ana no superó el total; su logro es 60%.' },
       { t: '20%', err: 'Revisa: \\(\\tfrac{100\\cdot30}{50}=60\\%\\).' }],
      'Correcto. \\(\\tfrac{100\\cdot30}{50}=60\\%\\).'));

    // P5 · Caso 3 contexto (Modelar)
    E.push(armar('Modelar', 'El 20% de los estudiantes de un curso son 6 personas. ¿Cuántos estudiantes tiene el curso?',
      [{ t: '30', err: null },
       { t: '1,2', err: '6 es el 20%; el curso es 5 veces esa parte: 30.' },
       { t: '120', err: 'Revisa: \\(\\tfrac{100\\cdot6}{20}=30\\).' },
       { t: '12', err: 'El 20% son 6, entonces el 100% son 30 (no 12).' }],
      'Correcto. El curso es \\(\\tfrac{100\\cdot6}{20}=30\\) estudiantes.'));

    // P6 · parte-todo (Representar)
    E.push(armar('Representar', 'Si el 25% de una cantidad corresponde a 15, ¿a qué valor corresponde el 100%?',
      [{ t: '60', err: null },
       { t: '15', err: '15 es solo el 25%; el 100% es 4 veces esa parte: 60.' },
       { t: '40', err: 'El 100% es 4 × 25%, o sea 4 × 15 = 60.' },
       { t: '75', err: 'Revisa: 25% → 15, entonces 100% → 15 · 4 = 60.' }],
      'Correcto. 25% → 15, entonces 100% → 15 · 4 = 60.'));

    // P7 · razonamiento proporcional (Argumentar)
    E.push(armar('Argumentar', 'Se sabe que 20 es el 40% de 50. ¿Cuál de estas afirmaciones se deduce correctamente?',
      [{ t: '10 es el 20% de 50.', err: null },
       { t: '50 es el 40% de 20.', err: 'Está al revés: 20 es la parte y 50 el total.' },
       { t: '40 es el 20% de 50.', err: '40 sería el 80% de 50, no el 20%.' },
       { t: '20 es el 40% de 100.', err: '20 es el 20% de 100, no el 40%.' }],
      'Correcto. La mitad de la parte (10) corresponde a la mitad del porcentaje (20%): los porcentajes conservan la proporción.'));

    // P8 · identificar el error (Argumentar)
    E.push(armar('Argumentar', 'Para calcular qué porcentaje es 15 de 60, una persona hace \\(\\tfrac{15}{60}=0,25\\) y responde "0,25%". ¿Es correcto?',
      [{ t: 'No: 0,25 equivale a 25%, no a 0,25%.', err: null },
       { t: 'Sí, es 0,25%.', err: '0,25 = 25%; falta multiplicar por 100 para pasar de decimal a porcentaje.' },
       { t: 'No: es 4%.', err: '60/15 = 4 está al revés; 15 de 60 = 25%.' },
       { t: 'No: es 250%.', err: '15 es menor que 60, no puede superar el 100%: es 25%.' }],
      'Correcto. 15 de 60 = \\(\\tfrac{15}{60}=0,25=25\\%\\). El decimal pasa a porcentaje multiplicando por 100.'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
</html>
