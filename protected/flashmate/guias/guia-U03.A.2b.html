<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Mate · U03.A.2b · Potencias</title>
<link rel="icon" href="https://emerinoo.github.io/flashmate/logo-erika.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U03.A.2b', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U03', unidadNum: '03', subunidad: 'A', nivel: 'b',
  titulo: 'Potencias',
  sub: 'Propiedades · multiplicación, división, potencia de potencia · exponente negativo',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Representar', 'Resolver problemas', 'Representar', 'Representar', 'Argumentar', 'Resolver problemas'],
  generar: function () {
    var E = [];

    // P1 · multiplicación igual base (Resolver)
    E.push(armar('Resolver problemas', 'Aplica las propiedades: \\(2^3\\cdot 2^4=\\)',
      [{ t: '\\(2^7\\)', err: null },
       { t: '\\(2^{12}\\)', err: 'Con igual base los exponentes se SUMAN, no se multiplican: \\(2^{3+4}=2^7\\).' },
       { t: '\\(4^7\\)', err: 'La base se conserva, no se multiplica: \\(2^{3+4}=2^7\\).' },
       { t: '\\(2^{1}\\)', err: 'Los exponentes se suman, no se restan: \\(2^{3+4}=2^7\\).' }],
      'Correcto. Igual base: se conserva la base y se suman los exponentes, \\(2^{3+4}=2^7\\).'));

    // P2 · división igual base (Resolver)
    E.push(armar('Resolver problemas', 'Aplica las propiedades: \\(3^5\\div 3^2=\\)',
      [{ t: '\\(3^3\\)', err: null },
       { t: '\\(3^7\\)', err: 'En la división los exponentes se RESTAN: \\(3^{5-2}=3^3\\).' },
       { t: '\\(1^3\\)', err: 'La base se conserva (es 3), no se divide entre sí: \\(3^{5-2}=3^3\\).' },
       { t: '\\(3^{2{,}5}\\)', err: 'Los exponentes se restan, no se dividen: \\(3^{5-2}=3^3\\).' }],
      'Correcto. Igual base en división: se conserva la base y se restan los exponentes, \\(3^{5-2}=3^3\\).'));

    // P3 · igual exponente, producto (Representar)
    E.push(armar('Representar', '¿Con cuál potencia de una sola base se puede escribir \\(2^3\\cdot 5^3\\)?',
      [{ t: '\\(10^3\\)', err: null },
       { t: '\\(10^6\\)', err: 'Con igual exponente se multiplican las BASES y se mantiene el exponente: \\((2\\cdot5)^3=10^3\\).' },
       { t: '\\(10^9\\)', err: 'El exponente se mantiene, no se multiplica: \\((2\\cdot5)^3=10^3\\).' },
       { t: '\\(7^3\\)', err: 'Las bases se multiplican, no se suman: \\(2\\cdot5=10\\), da \\(10^3\\).' }],
      'Correcto. Igual exponente: se multiplican las bases y se mantiene el exponente, \\(2^3\\cdot5^3=(2\\cdot5)^3=10^3\\).'));

    // P4 · potencia de potencia (Resolver)
    E.push(armar('Resolver problemas', 'Aplica las propiedades: \\((2^3)^5=\\)',
      [{ t: '\\(2^{15}\\)', err: null },
       { t: '\\(2^8\\)', err: 'En potencia de potencia los exponentes se MULTIPLICAN, no se suman: \\(2^{3\\cdot5}=2^{15}\\).' },
       { t: '\\(8^5\\)', err: 'Aunque \\(2^3=8\\), la forma pedida mantiene la base 2: \\(2^{3\\cdot5}=2^{15}\\).' },
       { t: '\\(2^{35}\\)', err: 'No se juntan las cifras: se multiplican \\(3\\cdot5=15\\), da \\(2^{15}\\).' }],
      'Correcto. Potencia de una potencia: se multiplican los exponentes, \\((2^3)^5=2^{3\\cdot5}=2^{15}\\).'));

    // P5 · exponente negativo base entera (Representar)
    E.push(armar('Representar', 'Escribe \\(5^{-2}\\) como fracción sin exponente negativo:',
      [{ t: '\\(\\tfrac{1}{25}\\)', err: null },
       { t: '\\(-25\\)', err: 'El exponente negativo NO hace negativo el resultado: invierte la base. \\(5^{-2}=\\tfrac{1}{5^2}=\\tfrac{1}{25}\\).' },
       { t: '\\(-\\tfrac{1}{25}\\)', err: 'El signo negativo del exponente indica inverso, no un resultado negativo: \\(\\tfrac{1}{25}\\).' },
       { t: '\\(\\tfrac{1}{10}\\)', err: '\\(5^2=25\\), no \\(5\\cdot2=10\\): \\(5^{-2}=\\tfrac{1}{25}\\).' }],
      'Correcto. \\(x^{-n}=\\tfrac{1}{x^n}\\): \\(5^{-2}=\\tfrac{1}{5^2}=\\tfrac{1}{25}\\).'));

    // P6 · exponente negativo base fraccionaria (Representar)
    E.push(armar('Representar', 'Escribe \\(\\left(\\tfrac{3}{4}\\right)^{-2}\\) sin exponente negativo:',
      [{ t: '\\(\\tfrac{16}{9}\\)', err: null },
       { t: '\\(\\tfrac{9}{16}\\)', err: 'El exponente negativo INVIERTE la fracción antes de elevar: \\(\\left(\\tfrac43\\right)^2=\\tfrac{16}{9}\\).' },
       { t: '\\(-\\tfrac{16}{9}\\)', err: 'No da negativo: el signo del exponente solo invierte la base. \\(\\tfrac{16}{9}\\).' },
       { t: '\\(\\tfrac{6}{8}\\)', err: 'Hay que elevar al cuadrado tras invertir: \\(\\left(\\tfrac43\\right)^2=\\tfrac{16}{9}\\).' }],
      'Correcto. \\(\\left(\\tfrac{x}{y}\\right)^{-n}=\\left(\\tfrac{y}{x}\\right)^{n}\\): \\(\\left(\\tfrac34\\right)^{-2}=\\left(\\tfrac43\\right)^2=\\tfrac{16}{9}\\).'));

    // P7 · error tipico (Argumentar)
    E.push(armar('Argumentar', 'Un estudiante afirma que \\(2^3\\cdot 2^4=4^7\\). ¿Es correcto?',
      [{ t: 'No: es \\(2^7\\) (la base se conserva).', err: null },
       { t: 'Sí, está bien.', err: 'La base NO se multiplica cuando es la misma: se conserva y se suman los exponentes, \\(2^7\\).' },
       { t: 'No: es \\(4^{12}\\).', err: 'Ni la base ni el producto de exponentes: con igual base es \\(2^{3+4}=2^7\\).' },
       { t: 'No: es \\(2^{12}\\).', err: 'Los exponentes se suman, no se multiplican: \\(2^{3+4}=2^7\\).' }],
      'Correcto. Con igual base se conserva la base y se suman los exponentes: \\(2^3\\cdot2^4=2^7\\), no \\(4^7\\).'));

    // P8 · combinado con base negativa (Resolver)
    E.push(armar('Resolver problemas', 'Aplica las propiedades: \\(5^8\\div(-5)^2=\\)',
      [{ t: '\\(5^6\\)', err: null },
       { t: '\\(-5^6\\)', err: '\\((-5)^2=25=5^2\\) (positivo, exponente par). Entonces \\(5^8\\div5^2=5^6\\).' },
       { t: '\\(5^4\\)', err: 'Se restan los exponentes: \\(8-2=6\\), da \\(5^6\\).' },
       { t: '\\(5^{10}\\)', err: 'En división se restan, no se suman: \\(5^{8-2}=5^6\\).' }],
      'Correcto. \\((-5)^2=5^2\\) (par ⇒ positivo); luego \\(5^8\\div5^2=5^{8-2}=5^6\\).'));

    return E;
  }
};
</script>
<script defer src="../flashmate-engine.js"></script>
</body>
</html>
