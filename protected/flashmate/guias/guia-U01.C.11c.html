<script>
const NLS=4;
const LETRAS=['A','B','C','D','E'];
let nombreEstudiante='';
let EJ=[],actual=0,resp=[],sel=null;

function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){return esc(s).replace(/\n/g,'<br>');}
function mathify(el){ if(el&&window.renderMathInElement){ try{ renderMathInElement(el,{delimiters:[{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false}); }catch(e){} } }

function armar(hab, txt, opciones, fb_ok){
  const sh = shuffle(opciones);
  const ok = sh.findIndex(o => o.err === null);
  return {hab, txt, opts:sh, ok, fb_ok};
}

function generarEjercicios(){
  const E=[];

  // ── P1 · Decimal semiperiódico a fracción (Resolver) ──
  const SP=[
    {q:'\\(0,58\\overline3\\) (0,58333…)',ok:'\\(\\tfrac{7}{12}\\)',d:[['\\(\\tfrac{525}{999}\\)','El denominador es 900 (un 9 por el período y un 0 por cada cifra del anteperíodo), no 999.'],['\\(\\tfrac{583}{900}\\)','Al numerador se le resta el anteperíodo: 583 − 58 = 525.'],['\\(\\tfrac{7}{11}\\)','\\(0,58\\overline3=\\tfrac{525}{900}=\\tfrac{7}{12}\\).']],fb:'\\(0,58\\overline3=\\tfrac{583-58}{900}=\\tfrac{525}{900}=\\tfrac{7}{12}\\).'},
    {q:'\\(0,1\\overline6\\) (0,1666…)',ok:'\\(\\tfrac{1}{6}\\)',d:[['\\(\\tfrac{15}{99}\\)','El denominador es 90 (un 9 por el período, un 0 por el anteperíodo), no 99.'],['\\(\\tfrac{16}{90}\\)','Al numerador se le resta el anteperíodo: 16 − 1 = 15.'],['\\(\\tfrac{1}{5}\\)','\\(0,1\\overline6=\\tfrac{15}{90}=\\tfrac16\\).']],fb:'\\(0,1\\overline6=\\tfrac{16-1}{90}=\\tfrac{15}{90}=\\tfrac16\\).'}
  ];
  const c1=rnd(SP);
  E.push(armar('Resolver problemas',`¿Qué fracción representa ${c1.q}?`,
    [{t:c1.ok,err:null},{t:c1.d[0][0],err:c1.d[0][1]},{t:c1.d[1][0],err:c1.d[1][1]},{t:c1.d[2][0],err:c1.d[2][1]}],
    `Correcto. ${c1.fb}`));

  // ── P2 · Operatoria entero menos fracción (Resolver) ──
  const MIX=[
    {q:'2 − \\(\\tfrac34\\)',ok:'\\(\\tfrac54\\)',ent:'\\(\\tfrac84\\)',d:[['\\(-\\tfrac14\\)','El 2 es \\(\\tfrac84\\): \\(\\tfrac84-\\tfrac34=\\tfrac54\\), no una resta de la parte de arriba.'],['\\(\\tfrac14\\)','\\(2=\\tfrac84\\), y \\(\\tfrac84-\\tfrac34=\\tfrac54\\).'],['\\(\\tfrac52\\)','Revisa: \\(2-\\tfrac34=\\tfrac54\\), no \\(\\tfrac52\\).']]},
    {q:'3 − \\(\\tfrac25\\)',ok:'\\(\\tfrac{13}{5}\\)',ent:'\\(\\tfrac{15}{5}\\)',d:[['\\(\\tfrac15\\)','\\(3=\\tfrac{15}{5}\\): \\(\\tfrac{15}{5}-\\tfrac25=\\tfrac{13}{5}\\).'],['\\(\\tfrac{1}{5}\\)','\\(3=\\tfrac{15}{5}\\), y \\(\\tfrac{15}{5}-\\tfrac25=\\tfrac{13}{5}\\).'],['\\(\\tfrac{13}{15}\\)','El denominador se mantiene en 5: \\(\\tfrac{13}{5}\\).']]}
  ];
  const c2=rnd(MIX);
  E.push(armar('Resolver problemas',`¿Cuál es el resultado de ${c2.q}?`,
    [{t:c2.ok,err:null},{t:c2.d[0][0],err:c2.d[0][1]},{t:c2.d[1][0],err:c2.d[1][1]},{t:c2.d[2][0],err:c2.d[2][1]}],
    `Correcto. Se escribe el entero como fracción: ${c2.q.split(' − ')[0]} = ${c2.ent}, y ${c2.ent} − ${c2.q.split(' − ')[1]} = ${c2.ok}.`));

  // ── P3 · Identificar el error con distributiva (Argumentar) ──
  const ERR=[
    {en:'Una persona calcula \\(\\tfrac12\\cdot(4+6)\\), cometiendo un error.\nPaso 1: usa la distributiva: \\(\\tfrac12\\cdot4+\\tfrac12\\cdot6\\).\nPaso 2: calcula: \\(2+6\\).\nPaso 3: suma: 8.\nPaso 4: concluye 8.\n¿En qué paso está el error?',fb:'\\(\\tfrac12\\cdot6=3\\), no 6. El resultado es \\(2+3=5\\) (o directo, \\(\\tfrac12\\cdot10=5\\)).'},
    {en:'Una persona calcula \\(\\tfrac13\\cdot(6+9)\\), cometiendo un error.\nPaso 1: usa la distributiva: \\(\\tfrac13\\cdot6+\\tfrac13\\cdot9\\).\nPaso 2: calcula: \\(2+9\\).\nPaso 3: suma: 11.\nPaso 4: concluye 11.\n¿En qué paso está el error?',fb:'\\(\\tfrac13\\cdot9=3\\), no 9. El resultado es \\(2+3=5\\) (o directo, \\(\\tfrac13\\cdot15=5\\)).'}
  ];
  const c3=rnd(ERR);
  E.push(armar('Argumentar',c3.en,
    [{t:'En el Paso 2',err:null},
     {t:'En el Paso 1',err:'La distributiva está bien aplicada.'},
     {t:'En el Paso 3',err:'La suma con lo que traía es correcta; el error viene antes.'},
     {t:'No hay error',err:`Sí hay: ${c3.fb}`}],
    `Correcto. El error está en el Paso 2: ${c3.fb}`));

  // ── P4 · Ordenar tres fracciones (Representar) ──
  const ORD=[
    {items:'\\(\\tfrac12\\), \\(\\tfrac13\\) y \\(\\tfrac25\\)',order:'\\(\\tfrac13\\), \\(\\tfrac25\\), \\(\\tfrac12\\)',dec:'0,33 < 0,4 < 0,5',d:[['\\(\\tfrac12\\), \\(\\tfrac25\\), \\(\\tfrac13\\)','Ese es de MAYOR a menor.'],['\\(\\tfrac13\\), \\(\\tfrac12\\), \\(\\tfrac25\\)','\\(\\tfrac12=0{,}5\\) es el mayor, va al final.'],['\\(\\tfrac25\\), \\(\\tfrac13\\), \\(\\tfrac12\\)','\\(\\tfrac13\\approx0{,}33\\) es el menor, va primero.']]},
    {items:'\\(\\tfrac34\\), \\(\\tfrac23\\) y \\(\\tfrac56\\)',order:'\\(\\tfrac23\\), \\(\\tfrac34\\), \\(\\tfrac56\\)',dec:'0,67 < 0,75 < 0,83',d:[['\\(\\tfrac56\\), \\(\\tfrac34\\), \\(\\tfrac23\\)','Ese es de mayor a menor.'],['\\(\\tfrac34\\), \\(\\tfrac23\\), \\(\\tfrac56\\)','\\(\\tfrac23\\approx0{,}67\\) es el menor, va primero.'],['\\(\\tfrac23\\), \\(\\tfrac56\\), \\(\\tfrac34\\)','\\(\\tfrac56\\approx0{,}83\\) es el mayor, va al final.']]}
  ];
  const c4=rnd(ORD);
  E.push(armar('Representar',`Ordena de MENOR a MAYOR: ${c4.items}.`,
    [{t:c4.order,err:null},{t:c4.d[0][0],err:c4.d[0][1]},{t:c4.d[1][0],err:c4.d[1][1]},{t:c4.d[2][0],err:c4.d[2][1]}],
    `Correcto. En decimales: ${c4.dec}; el orden es ${c4.order}.`));

  // ── P5 · Fracción de una fracción, contexto estanque (Modelar) ──
  E.push(armar('Modelar','Un estanque está lleno a \\(\\tfrac34\\) de su capacidad y se vacía \\(\\tfrac13\\) de lo que hay. ¿Qué fracción del estanque se vació?',
    [{t:'\\(\\tfrac14\\)',err:null},
     {t:'\\(\\tfrac{13}{12}\\)',err:'"\\(\\tfrac13\\) de lo que hay" indica MULTIPLICAR: \\(\\tfrac34\\cdot\\tfrac13=\\tfrac14\\).'},
     {t:'\\(\\tfrac{5}{12}\\)',err:'No es suma; es producto: \\(\\tfrac34\\cdot\\tfrac13=\\tfrac14\\).'},
     {t:'\\(\\tfrac34\\)',err:'Se vacía una PARTE de lo que hay: \\(\\tfrac34\\cdot\\tfrac13=\\tfrac14\\).'}],
    'Correcto. \\(\\tfrac13\\) de \\(\\tfrac34\\) \\(=\\tfrac34\\cdot\\tfrac13=\\tfrac{3}{12}=\\tfrac14\\) del estanque.'));

  // ── P6 · Cuántos trozos (división), contexto cinta (Modelar) ──
  E.push(armar('Modelar','Una cinta mide \\(\\tfrac56\\) de metro. Se cortan trozos de \\(\\tfrac16\\) de metro cada uno. ¿Cuántos trozos se obtienen?',
    [{t:'5',err:null},
     {t:'\\(\\tfrac{5}{36}\\)',err:'Dividir es multiplicar por el inverso: \\(\\tfrac56\\cdot\\tfrac61=5\\).'},
     {t:'6',err:'Revisa: \\(\\tfrac56\\div\\tfrac16=5\\) trozos.'},
     {t:'\\(\\tfrac{4}{6}\\)',err:'Es una división: \\(\\tfrac56\\div\\tfrac16=5\\).'}],
    'Correcto. \\(\\tfrac56\\div\\tfrac16=\\tfrac56\\cdot\\tfrac61=5\\) trozos.'));

  // ── P7 · Fracción a decimal (Representar) ──
  const FD=[
    {frac:'\\(\\tfrac58\\)',dec:'0,625',d:[['0,58','No es "coma 58"; \\(5\\div8=0,625\\).'],['1,6','Invertiste: \\(5\\div8=0,625\\), no \\(8\\div5\\).'],['0,85','\\(\\tfrac58=0,625\\), no 0,85.']]},
    {frac:'\\(\\tfrac{7}{20}\\)',dec:'0,35',d:[['0,72','No es "coma 72"; \\(7\\div20=0,35\\).'],['2,85','Invertiste: \\(7\\div20=0,35\\).'],['0,7','\\(\\tfrac{7}{20}=0,35\\), no 0,7.']]}
  ];
  const c7=rnd(FD);
  E.push(armar('Representar',`¿Cuál es la representación decimal de ${c7.frac}?`,
    [{t:c7.dec,err:null},{t:c7.d[0][0],err:c7.d[0][1]},{t:c7.d[1][0],err:c7.d[1][1]},{t:c7.d[2][0],err:c7.d[2][1]}],
    `Correcto. ${c7.frac} = ${c7.dec}.`));

  // ── P8 · Propiedad de los racionales (Argumentar) ──
  E.push(armar('Argumentar','¿Cuál de las siguientes afirmaciones sobre los números racionales es correcta?',
    [{t:'Todo número racional distinto de cero tiene un inverso multiplicativo (recíproco).',err:null},
     {t:'El 0 tiene inverso multiplicativo.',err:'Falso: no se puede dividir por 0; el 0 no tiene recíproco.'},
     {t:'La división de dos racionales siempre da un racional.',err:'Falso: no se puede dividir por 0.'},
     {t:'Todo número racional es un número entero.',err:'Falso: \\(\\tfrac34\\) es racional pero no entero.'}],
    'Correcto. Todo racional ≠ 0 tiene recíproco (\\(\\tfrac{a}{b}\\to\\tfrac{b}{a}\\)); su producto da 1. El 0 es la excepción.'));

  return E;
}

function hcss(h){
  if(h==='Resolver problemas')return 'hab-rp';
  if(h==='Modelar')return 'hab-m';
  if(h==='Representar')return 'hab-r';
  return 'hab-a';
}

function validarCorreo(correo){
  if(correo.indexOf('@')===-1) return false;
  var partes=correo.split('@');
  if(partes.length!==2) return false;
  if(partes[0].length===0) return false;
  if(partes[1].indexOf('.')===-1) return false;
  var dominio=partes[1].split('.');
  if(dominio[0].length===0) return false;
  if(dominio[dominio.length-1].length<2) return false;
  return true;
}
function iniciar(){
  const nom=document.getElementById('inp-nombre').value.trim();
  const cor=document.getElementById('inp-correo').value.trim();
  if(!nom||!cor){document.getElementById('error-ident').style.display='block';return;}
  if(!validarCorreo(cor)){document.getElementById('error-ident').textContent='Por favor ingresa un correo válido. Ejemplo: nombre@gmail.com';document.getElementById('error-ident').style.display='block';return;}
  document.getElementById('error-ident').textContent='Por favor completa tu nombre y correo.';
  nombreEstudiante=nom;
  document.getElementById('zona-ident').style.display='none';
  document.getElementById('zona-q').style.display='block';
  EJ=generarEjercicios();
  resp=new Array(8).fill(null);
  actual=0;sel=null;
  render();
}

function render(){
  const e=EJ[actual];
  document.getElementById('qnum').textContent=`Pregunta ${actual+1} de 8`;
  document.getElementById('barra').style.width=((actual+1)/8*100)+'%';
  document.getElementById('htag').innerHTML=`<span class="hab-tag ${hcss(e.hab)}">${e.hab}</span>`;
  document.getElementById('qtxt').innerHTML=fmt(e.txt);
  sel=null;
  const od=document.getElementById('opts');
  od.innerHTML='';
  e.opts.forEach((o,i)=>{
    const d=document.createElement('div');
    d.className='opt';d.id='op'+i;
    d.innerHTML=`<div class="letra">${LETRAS[i]}</div><span class="otxt">${fmt(o.t)}</span>`;
    d.onclick=()=>elegir(i);
    od.appendChild(d);
  });
  const nls=document.createElement('div');
  nls.className='opt nls';nls.id='op4';
  nls.innerHTML=`<div class="letra" style="border-style:dashed">E</div><span class="otxt">No lo sé</span>`;
  nls.onclick=()=>elegir(4);
  od.appendChild(nls);
  mathify(document.getElementById('qtxt'));mathify(document.getElementById('opts'));
  document.getElementById('fb').style.display='none';
  document.getElementById('btnc').style.display='inline-block';
  document.getElementById('btnc').disabled=true;
  document.getElementById('btns').style.display='none';
}

function elegir(i){
  if(document.getElementById('btnc').style.display==='none')return;
  document.querySelectorAll('.opt').forEach(d=>d.classList.remove('sel'));
  document.getElementById('op'+i).classList.add('sel');
  sel=i;document.getElementById('btnc').disabled=false;
}

function confirmar(){
  if(sel===null)return;
  const e=EJ[actual];resp[actual]=sel;
  const esNls=sel===NLS;
  const esOk=!esNls&&sel===e.ok;
  document.querySelectorAll('.opt').forEach((d,i)=>{
    d.onclick=null;
    if(i===NLS){d.className='opt nls dis';return;}
    if(i===e.ok)d.className='opt '+(esOk?'ok':'show');
    else if(i===sel&&!esOk&&!esNls)d.className='opt mal';
    else d.className='opt dis';
  });
  const fb=document.getElementById('fb');
  if(esNls){
    fb.className='fb nls';
    fb.innerHTML=fmt(`La respuesta correcta es ${LETRAS[e.ok]}: ${e.opts[e.ok].t}. ${e.fb_ok.replace(/^Correcto\. /,'')}`);
  } else if(esOk){
    fb.className='fb ok';
    fb.innerHTML=fmt(e.fb_ok);
  } else {
    fb.className='fb mal';
    fb.innerHTML=fmt(e.opts[sel].err);
  }
  mathify(fb);
  fb.style.display='block';
  document.getElementById('btnc').style.display='none';
  const bs=document.getElementById('btns');
  bs.style.display='inline-block';
  bs.textContent=actual<7?'Siguiente →':'Ver resultados →';
}

function siguiente(){
  if(actual<7){actual++;render();}
  else mostrarFinal();
}

function mostrarFinal(){
  document.getElementById('zona-q').style.display='none';
  document.getElementById('zona-final').style.display='block';
  document.getElementById('barra').style.width='100%';
  const corr=resp.filter((r,i)=>r===EJ[i].ok).length;
  const nlsC=resp.filter(r=>r===NLS).length;
  const incorrectas=8-corr-nlsC;
  const pct=Math.round(corr/8*100);
  document.getElementById('pje').textContent=corr+' / 8 correctas';
  registrar(corr,incorrectas,nlsC,pct);
  document.getElementById('pmsg').textContent=pct+'% de logro'+(nlsC>0?` · ${nlsC} sin responder`:'');
  const al=document.getElementById('alerta');
  const MSGS={
    alto:[{titulo:'🔥 ¡Dominaste esta guía!',txt:'Tu cerebro matemático está encendido. Puedes avanzar con confianza.'},{titulo:'⚡ ¡Excelente nivel!',txt:'Eso es exactamente el nivel PAES que necesitas. ¡Sigue así!'},{titulo:'🎯 ¡Puntazo!',txt:'Cada guía así te acerca más al puntaje que quieres.'},{titulo:'🚀 ¡Así se hace!',txt:'Estás construyendo una base sólida. Tu esfuerzo se nota.'},{titulo:'🌟 ¡Brillante!',txt:'Logro de '+pct+'%. Eso no es suerte, es práctica constante.'}],
    medio:[{titulo:'💪 ¡Vas bien!',txt:'Una repetición más y esta guía será tuya. ¡Tú puedes!'},{titulo:'📈 Buen avance',txt:'Estás construyendo algo sólido. Repite y confirma lo que aprendiste.'},{titulo:'✨ ¡Ya casi!',txt:'Con un intento más lo dominas. El progreso ya es visible.'},{titulo:'🎯 En camino',txt:'Cada intento te acerca más. Repite sin presión, con foco.'},{titulo:'⚡ Sigue sumando',txt:''+pct+'% de logro. Repite una vez más y lo tendrás dominado.'}],
    bajo:[{titulo:'💡 Esta guía te está enseñando algo importante',txt:'Cada error es información valiosa. Inténtalo de nuevo con calma.'},{titulo:'🧠 Así funciona el aprendizaje real',txt:'Los errores son parte del proceso. Repite antes de avanzar.'},{titulo:'🔄 No te rindas',txt:'Los conceptos nuevos necesitan más de un intento. ¡Vuelve a intentarlo!'},{titulo:'💪 El desafío es parte del camino',txt:'Repite esta guía. Con práctica constante lo lograrás.'},{titulo:'🌱 Aquí es donde más se aprende',txt:'Revisa las retroalimentaciones y vuelve a intentarlo. ¡Confía en el proceso!'}]
  };
  const nivel_msg=pct>=75?'alto':pct>=50?'medio':'bajo';
  const lista=MSGS[nivel_msg];
  const msg=lista[Math.floor(Math.random()*lista.length)];
  if(nivel_msg==='alto'){al.className='alerta bien';al.innerHTML=`<strong>${msg.titulo}, ${nombreEstudiante}!</strong><br>${msg.txt}`;document.getElementById('btn-rep').textContent='Repetir para afianzar';}
  else if(nivel_msg==='medio'){al.className='alerta bien';al.innerHTML=`<strong>${msg.titulo}, ${nombreEstudiante}!</strong><br>${msg.txt}`;document.getElementById('btn-rep').textContent='Repetir con valores nuevos';}
  else{al.className='alerta rep';al.innerHTML=`<strong>${msg.titulo}, ${nombreEstudiante}.</strong><br>${msg.txt}`;document.getElementById('btn-rep').textContent='Repetir con valores nuevos';}
  const dots=document.getElementById('dots');
  dots.innerHTML='';
  resp.forEach((r,i)=>{
    const d=document.createElement('div');
    const ok=r===EJ[i].ok,nls=r===NLS;
    d.className='dot '+(ok?'ok':nls?'nls':'mal');
    dots.appendChild(d);
  });
  document.getElementById('reslista').innerHTML=resp.map((r,i)=>{
    const ok=r===EJ[i].ok,nls=r===NLS;
    const color=ok?'#085041':nls?'#5F5E5A':'#791F1F';
    const icono=ok?'✓':nls?'?':'✗';
    const txt=ok?'Correcta':nls?`No lo sé — correcta: ${LETRAS[EJ[i].ok]}`:`Incorrecta — correcta: ${LETRAS[EJ[i].ok]}`;
    return `<div style="color:${color}">${icono} P${i+1} (${EJ[i].hab}): ${txt}</div>`;
  }).join('');
}

function registrar(corr,incorr,nls,pct){
  if (window._modoDocente) return;
  var fecha=new Date().toLocaleDateString('es-CL',{timeZone:'America/Santiago'});
  var correo=document.getElementById('inp-correo').value.trim();
  var HAB_E=["Resolver problemas","Resolver problemas","Argumentar","Representar","Modelar","Modelar","Representar","Argumentar"];
  var ejercicios=resp.map(function(r,i){return r===4?2:(r===EJ[i].ok?1:0);});
  var falladas=[];
  resp.forEach(function(r,i){if(r!==EJ[i].ok&&falladas.indexOf(EJ[i].hab)===-1)falladas.push(EJ[i].hab);});
  var HAB_MAP={e1:HAB_E[0],e2:HAB_E[1],e3:HAB_E[2],e4:HAB_E[3],e5:HAB_E[4],e6:HAB_E[5],e7:HAB_E[6],e8:HAB_E[7]};
  var habCorr={'Resolver problemas':0,'Modelar':0,'Representar':0,'Argumentar':0};
  var habTot={'Resolver problemas':0,'Modelar':0,'Representar':0,'Argumentar':0};
  ['e1','e2','e3','e4','e5','e6','e7','e8'].forEach(function(k,i){
    var h=HAB_MAP[k];
    habTot[h]=(habTot[h]||0)+1;
    if(ejercicios[i]===1) habCorr[h]=(habCorr[h]||0)+1;
  });
  var lg=function(h){return habTot[h]>0?Math.round(habCorr[h]/habTot[h]*100)/100:'';};
  var params=[
    'fecha='+encodeURIComponent(fecha),'nombre='+encodeURIComponent(nombreEstudiante),'correo='+encodeURIComponent(correo),
    'tipo=individual','grupo=NA','guia=guia-U01.C.11c','eje=E1','unidad=U01','subunidad=C','nivel=c',
    'correctas='+corr,'incorrectas='+incorr,'nls='+nls,'logro='+(pct/100),
    'e1='+ejercicios[0],'e2='+ejercicios[1],'e3='+ejercicios[2],'e4='+ejercicios[3],'e5='+ejercicios[4],'e6='+ejercicios[5],'e7='+ejercicios[6],'e8='+ejercicios[7],
    'habilidades='+encodeURIComponent(falladas.join('|')),
    'logro_resolver='+lg('Resolver problemas'),'logro_modelar='+lg('Modelar'),'logro_representar='+lg('Representar'),'logro_argumentar='+lg('Argumentar')
  ].join('&');
  var img=new Image();
  img.src='https://script.google.com/macros/s/AKfycbzsGCpwyNNFC03rbCLUwnPLTHBAn5FZxEJrqq1JX0LrDAY7jmJRQ58bcdaQ8XtS6MM3/exec?'+params;
}

function volverPortal(){
  const params=new URLSearchParams(window.location.search);
  const nombre=params.get('nombre');
  const correo=params.get('correo');
  if(nombre&&correo){window.location.href='portal-estudiante.html?nombre='+encodeURIComponent(nombre)+'&correo='+encodeURIComponent(correo);}
  else{window.location.href='portal-estudiante.html';}
}
function reiniciar(){
  EJ=generarEjercicios();actual=0;resp=new Array(8).fill(null);sel=null;
  document.getElementById('zona-final').style.display='none';
  document.getElementById('zona-q').style.display='block';
  render();
}

window.addEventListener('load', function() {
  const params=new URLSearchParams(window.location.search);
  const modo=params.get('modo');
  const nombre=params.get('nombre');
  const correo=params.get('correo');
  if(modo==='docente'){
    window._modoDocente=true;nombreEstudiante='Vista docente';
    document.getElementById('zona-ident').style.display='none';
    document.getElementById('zona-q').style.display='block';
    EJ=generarEjercicios();resp=new Array(8).fill(null);actual=0;sel=null;render();
    return;
  }
  if(nombre&&correo){
    document.getElementById('inp-nombre').value=nombre;
    document.getElementById('inp-correo').value=correo;
    document.getElementById('zona-ident').style.display='none';
    document.getElementById('zona-q').style.display='block';
    nombreEstudiante=nombre;
    EJ=generarEjercicios();resp=new Array(8).fill(null);actual=0;sel=null;render();
  }
});
</script>
