<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<body>
<script>
window.FLASHMATE = {
  guia: 'guia-U02.A.5c', eje: 'E1', ejeNombre: 'NÚMEROS', unidad: 'U02', unidadNum: '02', subunidad: 'A', nivel: 'c',
  titulo: 'Porcentajes',
  sub: 'Aumento y disminución porcentual',
  HAB_E: ['Resolver problemas', 'Resolver problemas', 'Modelar', 'Modelar', 'Representar', 'Representar', 'Argumentar', 'Argumentar'],
  generar: function () {
    var E = [];

    // P1 · aumento (Resolver)
    E.push(armar('Resolver problemas', 'Un celular cuesta $200.000 y su precio sube un 10%. ¿Cuál es el nuevo precio?',
      [{ t: '$220.000', err: null },
       { t: '$20.000', err: 'Ese es solo el aumento; el nuevo precio lo SUMA: 200.000 + 20.000 = $220.000.' },
       { t: '$210.000', err: 'El 10% de 200.000 es 20.000 (no 10.000). Nuevo precio: $220.000.' },
       { t: '$180.000', err: 'El precio SUBE, no baja: $220.000.' }],
      'Correcto. Cantidad final = 200.000 · (1 + \\(\\tfrac{10}{100}\\)) = 200.000 · 1,1 = $220.000.'));

    // P2 · disminución (Resolver)
    E.push(armar('Resolver problemas', 'Una bicicleta cuesta $150.000 y baja un 20%. ¿Cuál es el nuevo precio?',
      [{ t: '$120.000', err: null },
       { t: '$30.000', err: 'Ese es el descuento; el nuevo precio lo RESTA: 150.000 − 30.000 = $120.000.' },
       { t: '$130.000', err: 'El 20% de 150.000 es 30.000 (no 20.000). Nuevo precio: $120.000.' },
       { t: '$180.000', err: 'El precio BAJA, no sube: $120.000.' }],
      'Correcto. Cantidad final = 150.000 · (1 − \\(\\tfrac{20}{100}\\)) = 150.000 · 0,8 = $120.000.'));

    // P3 · aumento sueldo (Modelar)
    E.push(armar('Modelar', 'Un sueldo de $500.000 sube un 8%. ¿Cuál es el nuevo sueldo?',
      [{ t: '$540.000', err: null },
       { t: '$40.000', err: 'Ese es solo el aumento; el nuevo sueldo es 500.000 + 40.000 = $540.000.' },
       { t: '$508.000', err: 'El 8% de 500.000 es 40.000 (no 8.000). Nuevo sueldo: $540.000.' },
       { t: '$460.000', err: 'El sueldo SUBE: $540.000.' }],
      'Correcto. 500.000 · 1,08 = $540.000 (aumento de 40.000).'));

    // P4 · disminución población (Modelar)
    E.push(armar('Modelar', 'Un pueblo de 2.000 habitantes reduce su población un 15%. ¿Cuántos habitantes quedan?',
      [{ t: '1.700', err: null },
       { t: '300', err: 'Esos son los que se fueron; quedan 2.000 − 300 = 1.700.' },
       { t: '1.985', err: 'El 15% de 2.000 es 300 (no 15). Quedan 1.700.' },
       { t: '1.850', err: 'Revisa: 15% de 2.000 = 300; quedan 1.700.' }],
      'Correcto. 2.000 · (1 − 0,15) = 2.000 · 0,85 = 1.700 habitantes.'));

    // P5 · factor de aumento (Representar)
    E.push(armar('Representar', 'Aumentar una cantidad en un 30% equivale a multiplicarla por:',
      [{ t: '1,3', err: null },
       { t: '0,3', err: 'Multiplicar por 0,3 da solo el aumento. El total es 100% + 30% = 1,3.' },
       { t: '0,7', err: 'Eso sería una DISMINUCIÓN del 30%. Un aumento multiplica por más de 1.' },
       { t: '30', err: 'El 30% = 0,3; el factor de aumento es 1 + 0,3 = 1,3.' }],
      'Correcto. Aumentar 30% = multiplicar por 1 + \\(\\tfrac{30}{100}\\) = 1,3.'));

    // P6 · factor de disminución (Representar)
    E.push(armar('Representar', 'Disminuir una cantidad en un 12% equivale a multiplicarla por:',
      [{ t: '0,88', err: null },
       { t: '0,12', err: 'Multiplicar por 0,12 da solo lo que se pierde. Queda el 88%: 0,88.' },
       { t: '1,12', err: 'Eso es un AUMENTO del 12%. Una disminución multiplica por menos de 1.' },
       { t: '12', err: 'El 12% = 0,12; el factor de disminución es 1 − 0,12 = 0,88.' }],
      'Correcto. Disminuir 12% = multiplicar por 1 − \\(\\tfrac{12}{100}\\) = 0,88.'));

    // P7 · sube y baja el mismo % (Argumentar)
    E.push(armar('Argumentar', 'Un precio SUBE un 50% y luego BAJA un 50%. ¿Queda igual que al inicio?',
      [{ t: 'No: queda en el 75% del inicial.', err: null },
       { t: 'Sí, queda igual.', err: 'El segundo 50% se calcula sobre un valor mayor: 1,5 · 0,5 = 0,75, no 1.' },
       { t: 'Queda en el 100%.', err: '1,5 · 0,5 = 0,75, o sea el 75% del inicial.' },
       { t: 'Queda mayor que al inicio.', err: 'Queda MENOR: 1,5 · 0,5 = 0,75 (75%).' }],
      'Correcto. 1,5 · 0,5 = 0,75: el precio queda en el 75% del inicial, más barato.'));

    // P8 · deshacer un aumento (Argumentar)
    E.push(armar('Argumentar', 'Un producto SUBE un 25%. Para volver EXACTAMENTE al precio original, ¿qué descuento hay que aplicar al nuevo precio?',
      [{ t: 'Un 20%.', err: null },
       { t: 'Un 25%.', err: 'El 25% del nuevo precio (mayor) descuenta de más. Se necesita 20%.' },
       { t: 'Un 75%.', err: 'Con 75% de descuento quedaría muy por debajo. Se necesita 20%.' },
       { t: 'No se puede volver.', err: 'Sí se puede: de 125 hay que quitar 25, que es el 20% de 125.' }],
      'Correcto. Si sube 25%: 100 → 125. Para volver a 100 hay que quitar 25 de 125, que es el 20% de 125.'));

    return E;
  }
};
</script>
