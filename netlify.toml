[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["protected/**"]

[[redirects]]
  from = "/flashmate/guia-*.html"
  to = "/.netlify/functions/ver-guia?codigo=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/flashmate/ensayo-*.html"
  to = "/.netlify/functions/ver-ensayo?codigo=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/protected/*"
  to = "/404.html"
  status = 404
  force = true
